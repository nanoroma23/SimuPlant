<html lang="es">
<head>
  <meta charset="UTF-8"/>

  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg,#080c14);font-family:'DM Sans','Segoe UI',sans-serif;color:var(--text,#e8eaf0)}
    #root{min-height:100vh}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--scrollThumb,#1e2535)}
    .btn{cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:all .15s;border-radius:10px;-webkit-appearance:none;appearance:none}
    .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
    .btn:active{transform:translateY(0);filter:brightness(.95)}
    .card{background:var(--card,#0d1321);border:1px solid var(--cardBorder,#1a2235);border-radius:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:11px;font-weight:600;color:var(--textMuted,#4a5568);text-transform:uppercase;letter-spacing:.08em}
    .inp{background:var(--inputBg,#080c14);border:1px solid var(--cardBorder,#1a2235);color:var(--text,#e8eaf0);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%;-webkit-appearance:none;appearance:none}
    select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a5568' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:14px;padding-right:34px}
    .inp:focus{border-color:var(--accent,#3b82f6)}
    .mono{font-family:'DM Mono',monospace}
    .fade{animation:fi .22s ease}
    @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .row{cursor:pointer;transition:all .15s}
    .row:hover{transform:translateX(3px);border-color:var(--hoverCard,#2a3550)!important}
  </style>
</head>

<script type="text/babel" data-presets="react">
(function() {
  const { useState, useEffect, useRef } = React;

  const SUPABASE_URL = "https://czktusbzqrqcdxfmhioc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nJE2_030ourYKjbk_lKlTQ__8l2O0Sg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const THEMES = {
    dark: {
      bg: "#080c14", card: "#0d1321", cardBorder: "#1a2235", text: "#e8eaf0",
      textSecondary: "#8b9ab0", textMuted: "#4a5568", accent: "#3b82f6",
      success: "#10b981", error: "#ef4444", warning: "#facc15",
      overlayDark: "#000c", shadowSoft: "#0008", inputBg: "#080c14",
      hoverCard: "#2a3550", scrollThumb: "#1e2535", btnSecondary: "#1a2235",
      errorBg: "#1a0a0a", errorBorder: "#2d1212"
    },
    light: {
      bg: "#faf8f3", card: "#ffffff", cardBorder: "#e8dfd0", text: "#3d2e1f",
      textSecondary: "#6d5d4b", textMuted: "#8b6f47", accent: "#d4a574",
      success: "#8ab17d", error: "#d77a61", warning: "#e9c46a",
      overlayDark: "rgba(61,46,31,0.75)", shadowSoft: "rgba(139,92,46,0.15)", inputBg: "#fdf6ed",
      hoverCard: "#d4c5b0", scrollThumb: "#c8b89f", btnSecondary: "#f0e8dd",
      errorBg: "#f5e5e1", errorBorder: "#e5c5bd"
    }
  };
  const getColors = (isDark) => THEMES[isDark ? 'dark' : 'light'];

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const norm = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const matchStr = (a, b) => {
    return norm(a) === norm(b);
  };
  const fmt = (n) => n == null ? "—" : `$${Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
  const todayISO = () => new Date().toISOString().split("T")[0];
  // Calcula el descuento aplicado por una promo sobre un subtotal, respetando el tope si está limitada.
  // Como el % es igual para toda la compra, distribuir proporcionalmente a cada producto
  // equivale a multiplicar el total de cada uno por el mismo factor.
  const calcPromo=(subtotal,promo)=>{
    if(!promo||!subtotal||subtotal<=0)return{descuentoAplicado:0,factor:1};
    const pct=parseFloat(String(promo.pct||0).replace(",","."))||0;
    const rawDescuento=subtotal*pct/100;
    const limite=promo.limitado?(parseFloat(String(promo.limite||0).replace(",","."))||0):null;
    const descuentoAplicado=promo.limitado?Math.min(rawDescuento,limite):rawDescuento;
    const factor=descuentoAplicado>0?(subtotal-descuentoAplicado)/subtotal:1;
    return{descuentoAplicado,factor};
  };
  const COLORS = ["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
  const alpha = (a, b, key="label") => (a[key]||"").localeCompare(b[key]||"", "es");
  const alphaStr = (a, b) => (a||"").localeCompare(b||"", "es");
  const fmtU = (u) => {
    if (!u) return "—";
    if (Number.isInteger(u)) return String(u);
    const fracs = [[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
    for (const [v,s] of fracs) if (Math.abs(u-v)<0.001) return s;
    return Number(u.toFixed(2)).toLocaleString("es-AR");
  };

  // Parse "NxM" format → total numeric value. "4x30"→120, "300"→300
  const parseQty = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("x")) {
      const [a, b] = str.split("x").map(Number);
      return (isNaN(a)||isNaN(b)) ? null : a * b;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };

  // Parse fraction input "1/3" → 0.333, "2" → 2
  const parseFrac = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("/")) {
      const [a,b] = str.split("/").map(Number);
      return (!isNaN(a)&&!isNaN(b)&&b!==0) ? a/b : null;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };
  // Muestra "3x40m" si hay display guardado, sino "120m"
  const fmtCantRef=(p)=>{if(!p||!p.cantidadRef)return "";if(p.unidad==="m"&&p.rollosRef&&p.metrosRef)return `${p.rollosRef}x${p.metrosRef}m`;return `${p.cantidadRef}${p.unidad||""}`;};

  const DEFAULT_CATS = [
    { id:"primario",   label:"Primario",   emoji:"🛒", color:"#60a5fa", subs:[] },
    { id:"higiene",    label:"Higiene",    emoji:"🧴", color:"#f472b6", subs:[] },
    { id:"verduleria", label:"Verdulería", emoji:"🥦", color:"#4ade80", subs:[] },
    { id:"carniceria", label:"Carnicería", emoji:"🥩", color:"#fb923c", subs:[] },
    { id:"secundario", label:"Secundario", emoji:"🍪", color:"#a78bfa", subs:[] },
  ];
  const DEFAULT_PRODUCTOS = [];
  const UNASSIGNED_ID = "__sin_sub__";

  function isUnassignedProd(p, cat) {
    if (!cat || !cat.subs.length) return false;
    return !p.subId || !cat.subs.find(s => s.id === p.subId);
  }

  // Backup export — full format compatible with import
  function buildBackupText(cats, productos) {
    const lines = [];
    [...cats].sort((a,b)=>alpha(a,b)).forEach(cat => {
      const catProds = productos.filter(p=>p.catId===cat.id);
      if (!catProds.length) return;
      lines.push(`---${cat.label}---`);
      if (cat.subs.length === 0) {
        [...catProds].sort((a,b)=>alpha(a,b,"nombre")).forEach(p => {
          const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
            const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
            for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
            return p.unidadesMes.toFixed(2);
          })()) : "";
          const cant = p.cantidadRef||"";
          const unit = p.unidad||"gr";
          const precio = p.precioRef?`${p.precioRef}$`:"";
          lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
        });
      } else {
        [...cat.subs].sort((a,b)=>alpha(a,b)).forEach(sub => {
          const subProds = [...catProds.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!subProds.length) return;
          lines.push(sub.label);
          subProds.forEach(p => {
            const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
              const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
              for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
              return p.unidadesMes.toFixed(2);
            })()) : "";
            const cant = p.cantidadRef||"";
            const unit = p.unidad||"gr";
            const precio = p.precioRef?`${p.precioRef}$`:"";
            lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
          });
        });
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function buildExportText(cats, productos, filterCatId=null, filterSubId=null) {
    // Handle orphans export
    if(filterSubId==="__sin_sub__"&&filterCatId){
      const cat=cats.find(c=>c.id===filterCatId);
      const validSubs=new Set((cat?.subs||[]).map(s=>s.id));
      const orphans=productos.filter(p=>p.catId===filterCatId&&(!p.subId||!validSubs.has(p.subId)));
      const lines=[];
      lines.push(`=== ${cat?.label.toUpperCase()} — SIN SUBCATEGORÍA ===`);
      [...orphans].sort((a,b)=>alpha(a,b,"nombre")).forEach(p=>{const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";const um=p.unidadesMes||"";lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);});
      return lines.join("\n").trim();
    }
    const lines = [];
    const tCats = filterCatId ? cats.filter(c=>c.id===filterCatId) : [...cats].sort((a,b)=>alpha(a,b));
    tCats.forEach(cat => {
      const cp = productos.filter(p=>p.catId===cat.id); if (!cp.length) return;
      if (cat.subs.length===0) {
        const f = filterSubId ? [] : [...cp].sort((a,b)=>alpha(a,b,"nombre"));
        if (!f.length) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        f.forEach(p=>{
          const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";
          const um=p.unidadesMes||"";
          lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);
        });
      } else {
        const tSubs = filterSubId ? cat.subs.filter(s=>s.id===filterSubId) : [...cat.subs].sort((a,b)=>alpha(a,b));
        const validSubs=new Set(cat.subs.map(s=>s.id));
        const orphans=cp.filter(p=>!p.subId||!validSubs.has(p.subId));
        const hasProds = tSubs.some(sub => cp.some(p=>p.subId===sub.id)) || (!filterSubId&&orphans.length>0);
        if (!hasProds) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        tSubs.forEach(sub => {
          const sp = [...cp.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!sp.length) return;
          lines.push(`--- ${sub.label} ---`);
          sp.forEach(p=>{const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";const um=p.unidadesMes||"";lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);});
        });
        // Exportar huérfanos al final si no hay filtro de sub
        if(!filterSubId&&orphans.length>0){
          lines.push(`--- Sin subcategoría ---`);
          [...orphans].sort((a,b)=>alpha(a,b,"nombre")).forEach(p=>{const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";const um=p.unidadesMes||"";lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);});
        }
      }
    });
    return lines.join("\n").trim();
  }

  async function copyToClipboard(text) {
    try { if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; } } catch {}
    try {
      const el=document.createElement("textarea"); el.value=text; el.setAttribute("readonly","");
      el.style.cssText="position:absolute;left:-9999px;top:0"; document.body.appendChild(el);
      el.focus(); el.select(); el.setSelectionRange(0,el.value.length);
      const ok=document.execCommand("copy"); document.body.removeChild(el); return ok;
    } catch { return false; }
  }

  function parseProductLine(l) {
    if (!/\$/.test(l)||!l.includes("-")) return null;
    const parts=l.split("-").map(p=>p.trim()); if(parts.length<4) return null;
    const nombre=parts[0],marca=parts[1];
    const rawCant=(parts[2]||"").trim();
    const uLow=(parts[3]||"").toLowerCase();
    const unidad=uLow==="ml"?"mL":uLow==="l"?"L":uLow==="kg"?"kg":uLow==="m"?"m":uLow==="un"?"un":"gr";
    const precioRef=parseFloat((parts[4]||"").replace(/[$\s]/g,"").replace(",","."))||null;
    const umStr=(parts[5]||"").trim();
    const unidadesMes=umStr?(umStr.includes("/")?parseFloat(umStr.split("/")[0])/parseFloat(umStr.split("/")[1]):parseFloat(umStr.replace(",","."))):null;
    let cantidadRef=null, rollosRef=null, metrosRef=null;
    if(unidad==="m"){
      // Para metros debe ser formato NxM
      const mMatch=rawCant.match(/^(\d+(?:\.\d+)?)[xX×*](\d+(?:\.\d+)?)$/);
      if(!mMatch) return {error:`Formato inválido para metros: "${rawCant}". Usá formato 3x40 (o 3×40)`, nombre, marca};
      rollosRef=parseFloat(mMatch[1]);
      metrosRef=parseFloat(mMatch[2]);
      cantidadRef=rollosRef*metrosRef;
    } else {
      cantidadRef=uLow==="un"?parseFloat(rawCant)||null:(parseFloat(rawCant)||null);
    }
    return {nombre,marca,cantidadRef,rollosRef,metrosRef,unidad,precioRef,unidadesMes};
  }

  function parseImportText(text) {
    const lines=text.split("\n").map(l=>l.trim());
    const parsed=[]; let currentCat=null,currentSub=null,currentProducts=[];
    const flush=()=>{if(currentCat&&currentProducts.length){parsed.push({catLabel:currentCat,subLabel:currentSub,products:[...currentProducts]});currentProducts=[];}};
    for(const line of lines){
      if(!line) continue;
      const catMatch=line.match(/^---(.+?)---$/);
      if(catMatch){flush();currentCat=catMatch[1].trim();currentSub=null;continue;}
      if(!currentCat) continue;
      const prod=parseProductLine(line);
      if(prod){currentProducts.push(prod);}
      else{flush();currentSub=line;}
    }
    flush();
    return parsed;
  }


  function Confirm({colors,msg,onOk,onCancel,okLabel="Confirmar",okColor}) {
    const finalOkColor=okColor||colors.accent;
    const okTextColor=okColor===colors.error?"#fff":colors.bg;
    return (
      <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:colors.card,border:`1px solid ${colors.hoverCard}`,borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontSize:15,lineHeight:1.5,marginBottom:20,color:colors.text}}>{msg}</div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={onCancel} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:12}}>Cancelar</button>
            <button className="btn" onClick={onOk} style={{flex:1,background:finalOkColor,color:okTextColor,padding:12}}>{okLabel}</button>
          </div>
        </div>
      </div>
    );
  }

  function ItemSueltoModal({onClose,onSave,colors}) {
    const [nombre,setNombre]=useState("");
    const [precio,setPrecio]=useState("");
    const [cantidad,setCantidad]=useState("1");
    const precioNum=parseFloat((precio||"").replace(",","."));
    const cantNum=parseFloat((cantidad||"").replace(",","."))||1;
    const submit=()=>{
      if(!nombre.trim())return;
      if(!precioNum||precioNum<=0)return;
      onSave({nombre:nombre.trim(),precio:precioNum,cantidad:cantNum});
    };
    return (
      <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:1500,overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 20px 40px"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:colors.card,borderRadius:16,padding:"24px 20px",width:"100%",maxWidth:340,border:`1px solid ${colors.hoverCard}`,boxShadow:`0 8px 32px ${colors.shadowSoft}`}}>
          <div style={{fontWeight:700,fontSize:18,marginBottom:6,color:colors.text}}>Item suelto</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:20}}>Se suma al total del ticket, sin guardarse como producto</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            <div className="field"><label>Precio $</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 500" value={precio} onChange={e=>setPrecio(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus/></div>
            <div className="field"><label>Compré</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="1" value={cantidad} onChange={e=>setCantidad(e.target.value)}/></div>
          </div>
          <div className="field" style={{marginBottom:20}}><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. Bolsa de hielo" value={nombre} onChange={e=>setNombre(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={onClose} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:13,fontSize:14}}>Cancelar</button>
            <button className="btn" onClick={submit} style={{flex:2,background:colors.accent,color:colors.bg,padding:13,fontSize:15,fontWeight:700}}>Agregar</button>
          </div>
        </div>
      </div>
    );
  }

  function PromoModal({promo,subtotal,onClose,onSave,onQuitar,colors}) {
    const [pct,setPct]=useState(promo?String(promo.pct):"");
    const [limitado,setLimitado]=useState(promo?.limitado||false);
    const [limite,setLimite]=useState(promo?.limite?String(promo.limite):"");
    const pctNum=parseFloat((pct||"").replace(",","."))||0;
    const limiteNum=parseFloat((limite||"").replace(",","."))||0;
    const preview=calcPromo(subtotal,{pct:pctNum,limitado,limite:limiteNum});
    const submit=()=>{
      if(!pctNum||pctNum<=0)return;
      if(limitado&&(!limiteNum||limiteNum<=0))return;
      onSave({pct:pctNum,limitado,limite:limitado?limiteNum:null});
    };
    return (
      <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:1500,overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 20px 40px"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:colors.card,borderRadius:16,padding:"24px 20px",width:"100%",maxWidth:360,border:`1px solid ${colors.hoverCard}`,boxShadow:`0 8px 32px ${colors.shadowSoft}`}}>
          <div style={{fontWeight:700,fontSize:18,marginBottom:6,color:colors.text}}>🏷️ Promo</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:20}}>Descuento sobre el total de la compra, repartido en forma proporcional entre todos los productos</div>
          <div className="field" style={{marginBottom:14}}>
            <label>Descuento %</label>
            <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 20" value={pct} onChange={e=>setPct(e.target.value)} autoFocus/>
          </div>

  function TicketDrawer({ticket,setTicket,productos,cats,ticketOpen,setTicketOpen,onFinalizar,onCancelar,askConfirm,onAddSuelto,onAddProducto,promo,onEditPromo,stock,stockTotal,mesesRestantes,fmtMeses,colors}) {

                        <div style={{flex:1}}><div style={{fontSize:10,color:colors.textMuted,marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Compré</div><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" value={editCant} onChange={e=>setEditCant(e.target.value)} style={{padding:"7px 10px",fontSize:14}}/></div>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <button className="btn" onClick={()=>setEditIdx(null)} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:"7px 0",fontSize:13}}>Cancelar</button>
                        <button className="btn" onClick={guardarEdicion} style={{flex:2,background:colors.accent,color:"#fff",padding:"7px 0",fontSize:13}}>Guardar</button>
                      </div>
                    </div>

                    </div>
                  )}
                  {menuIdx===i&&editIdx!==i&&(
                    <div style={{display:"flex",gap:8,padding:"8px 0 2px 13px"}}>
                      <button className="btn" onClick={()=>{abrirEdicionModal(i);setMenuIdx(null);}} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,border:`1px solid ${colors.hoverCard}`,padding:"7px 0",fontSize:13}}>✏️ Editar</button>
                      <button className="btn" onClick={()=>{eliminarItem(i);setMenuIdx(null);}} style={{flex:1,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"7px 0",fontSize:13}}>✕ Eliminar</button>
                    </div>

            {/* Promo */}
            <div style={{padding:"10px 16px 0",flexShrink:0}}>

                {promo?`🏷️ Promo -${promo.pct}%${promo.limitado?` (tope ${fmt(promo.limite)})`:""} · editar`:"🏷️ Agregar promo"}

            <div style={{padding:"10px 16px 0",display:"flex",gap:8,borderTop:`1px solid ${colors.cardBorder}`,flexShrink:0}}>

              <button className="btn" onClick={onAddProducto} style={{flex:1,background:colors.btnSecondary,color:colors.accent,border:`1px solid ${colors.hoverCard}`,padding:"9px 0",fontSize:13}}>+ Producto nuevo</button>

            {/* Botones solo visibles dentro del panel expandido */}
            <div style={{padding:"10px 16px 14px",display:"flex",gap:8,flexShrink:0}}>

              <button className="btn" onClick={ticket.length>0?onFinalizar:undefined} style={{flex:1,background:ticket.length>0?"#10b981":"#1a2235",color:ticket.length>0?"#fff":"#4a5568",padding:"11px 0",fontSize:14,fontWeight:700,cursor:ticket.length>0?"pointer":"default"}}>Finalizar</button>

          </div>

    </>);
  }

  function TicketItemRow({item,factor=1,colors}) {
    const totalPagado=item.totalPagado??item.precio??0;
    const totalMostrado=totalPagado*factor;
    const precioMostrado=(item.precio??0)*factor;
    const totalRef=item.totalRef??null;
    const diffItem=totalRef>0?totalPagado-totalRef:null;
    const diffItemPct=totalRef>0?((totalPagado-totalRef)/totalRef*100).toFixed(1):null;
    const cantLabel=item.unidad==="m"&&item.rollosRef&&item.metrosRef
      ?`${item.rollosRef}x${item.metrosRef}m`
      :item.cantRef?`${item.cantRef}${item.unidad||""}`:null;
    return (
      <div style={{padding:"5px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:600,fontSize:13,color:colors.text,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.nombre}</div>
          <div style={{fontSize:12,color:factor<1?"#10b981":colors.textMuted,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap",marginLeft:8,display:"flex",alignItems:"center",gap:5}}>
            {factor<1&&<span style={{textDecoration:"line-through",color:colors.textMuted}}>{fmt(item.precio)}</span>}
            <span>{fmt(precioMostrado)} × {item.cantComprada||1}</span>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:2}}>
          <div style={{fontSize:11,color:colors.textMuted}}>{item.marca||""}{cantLabel?` · ${cantLabel}`:""}</div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            {diffItemPct!=null&&<div style={{fontSize:11,fontWeight:600,color:diffItem<=0?"#10b981":"#ef4444"}}>{diffItem<=0?"▼":"▲"} {Math.abs(parseFloat(diffItemPct))}%</div>}
            <div className="mono" style={{fontSize:13,fontWeight:700,color:factor<1?"#10b981":colors.text}}>{fmt(totalMostrado)}</div>
          </div>
        </div>
      </div>
    );
  }

  function FacturaModal({ticket,onClose,onEliminar,soloVer=false,askConfirm,colors}) {
    const fmtFecha=(f)=>new Date(f).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"});
    const totalPagado=ticket.items.reduce((s,x)=>s+(x.totalPagado??x.precio??0),0);
    const totalRef=ticket.items.filter(x=>!x.suelto&&(x.totalRef??0)>0).reduce((s,x)=>s+(x.totalRef??0),0);
    const totalPagadoConRef=ticket.items.filter(x=>!x.suelto&&(x.totalRef??0)>0).reduce((s,x)=>s+(x.totalPagado??x.precio??0),0);
    const diff=totalPagadoConRef-totalRef;
    const diffPct=totalRef>0?((diff/totalRef)*100).toFixed(1):null;
    return (
      <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:2500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:colors.card,borderRadius:16,width:"100%",maxWidth:420,maxHeight:"85vh",display:"flex",flexDirection:"column",border:`1px solid ${colors.hoverCard}`,boxShadow:`0 8px 32px ${colors.shadowSoft}`}}>
          {/* Header */}
          <div style={{padding:"20px 20px 16px",borderBottom:"1px solid #1a2235",flexShrink:0}}>
            <div style={{textAlign:"center",fontWeight:700,fontSize:17,color:colors.text,marginBottom:14}}>Compra finalizada</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
              <div>
                <div style={{fontSize:11,color:colors.textMuted}}>{fmtFecha(ticket.fecha)}</div>
                <div style={{fontSize:12,color:colors.textSecondary,marginTop:2}}>{ticket.items.length} producto{ticket.items.length!==1?"s":""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="mono" style={{fontWeight:700,fontSize:20,color:colors.text}}>{fmt(totalPagado)}</div>
                {ticket.promo&&<div style={{fontSize:11,fontWeight:600,color:"#10b981"}}>🏷️ Promo -{ticket.promo.pct}%: -{fmt(ticket.promo.descuentoAplicado)}</div>}
                {diffPct!==null&&<div style={{fontSize:12,fontWeight:600,color:diff<=0?"#10b981":"#ef4444"}}>{diff<=0?"▼":"▲"} {Math.abs(parseFloat(diffPct))}% vs ref</div>}
              </div>
            </div>
          </div>
          {/* Items */}
          <div style={{overflowY:"auto",flex:1,padding:"0 20px"}}>
            {ticket.items.map((item,j)=><TicketItemRow key={j} item={item} colors={colors}/>)}
          </div>
          {/* Botones */}
          <div style={{padding:"14px 20px",borderTop:`1px solid ${colors.cardBorder}`,display:"flex",gap:8,flexShrink:0}}>
            {!soloVer&&onEliminar&&<button className="btn" onClick={()=>askConfirm("¿Eliminar esta compra?",onEliminar,"Eliminar",colors.error)} style={{flex:1,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"11px 0",fontSize:14}}>Eliminar</button>}
            <button className="btn" onClick={onClose} style={{flex:1,background:soloVer?colors.success:colors.btnSecondary,color:soloVer?colors.bg:colors.text,padding:"11px 0",fontSize:14,fontWeight:soloVer?700:400}}>Cerrar</button>
          </div>
        </div>
      </div>
    );
  }

  function HistorialTickets({tickets,setTickets,onClose,askConfirm,colors}) {
    const [ticketAbierto,setTicketAbierto]=useState(null);
    const fmtFecha=(f)=>new Date(f).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"2-digit"});
    const eliminarTicket=async(id)=>{
      const nuevos=tickets.filter(t=>t.id!==id);
      setTickets(nuevos);
      setTicketAbierto(null);
      try{await sb.from("tickets").delete().eq("id",id);}catch(e){console.warn(e);}
    };
    return (<>
      <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:2000,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:colors.card,borderRadius:"20px 20px 0 0",padding:"24px 20px 36px",width:"100%",maxWidth:500,border:`1px solid ${colors.cardBorder}`,borderBottom:"none",maxHeight:"85vh",overflowY:"auto"}}>
          <div style={{width:40,height:4,background:colors.hoverCard,borderRadius:2,margin:"0 auto 20px"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:18,color:colors.text}}>🧾 Historial de compras</div>
            <div style={{fontSize:12,color:colors.textMuted}}>{tickets.length}/15</div>
          </div>
          {tickets.length===0&&<div style={{color:colors.textMuted,fontSize:14,textAlign:"center",padding:"40px 0"}}>Sin compras registradas aún.</div>}
          {tickets.map((t)=>{
            const totalPagado=t.items.reduce((s,x)=>s+(x.totalPagado??x.precio??0),0);
            const totalRef=t.items.filter(x=>!x.suelto&&(x.totalRef??0)>0).reduce((s,x)=>s+(x.totalRef??0),0);
            const totalPagadoConRef=t.items.filter(x=>!x.suelto&&(x.totalRef??0)>0).reduce((s,x)=>s+(x.totalPagado??x.precio??0),0);
            const diff=totalPagadoConRef-totalRef;
            const diffPct=totalRef>0?((diff/totalRef)*100).toFixed(1):null;
            return (
              <div key={t.id} className="card" style={{padding:14,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <div><div style={{fontSize:12,color:colors.textMuted}}>{fmtFecha(t.fecha)}</div><div style={{fontSize:11,color:colors.textSecondary,marginTop:2}}>{t.items.length} producto{t.items.length!==1?"s":""}</div></div>
                  <div style={{textAlign:"right"}}>
                    <div className="mono" style={{fontWeight:700,color:colors.text}}>{fmt(totalPagado)}</div>
                    {t.promo&&<div style={{fontSize:10,color:"#10b981",fontWeight:600}}>🏷️ -{t.promo.pct}%</div>}
                    {diffPct!==null&&<div style={{fontSize:11,color:diff<=0?"#10b981":"#ef4444",fontWeight:600}}>{diff<=0?"▼":"▲"} {Math.abs(parseFloat(diffPct))}%</div>}
                  </div>
                </div>
                <div style={{marginTop:8}}>
                  {t.items.map((item,j)=>(
                    <div key={j} style={{fontSize:12,color:colors.textSecondary,display:"flex",justifyContent:"space-between",padding:"3px 0",borderTop:`1px solid ${colors.cardBorder}`}}>
                      <span>{item.nombre}{item.cantComprada>1?` ×${item.cantComprada}`:""}</span>
                      <span className="mono" style={{color:colors.text}}>{fmt(item.totalPagado??item.precio)}</span>
                    </div>
                  ))}
                </div>
                <div style={{marginTop:6,paddingTop:6,borderTop:`1px solid ${colors.cardBorder}`,textAlign:"center"}}>
                  <button onClick={()=>setTicketAbierto(t)} style={{background:"none",border:"none",color:colors.textMuted,fontSize:12,cursor:"pointer",padding:"2px 0"}}>Ver detalle</button>
                </div>
              </div>
            );
          })}
          <button className="btn" onClick={onClose} style={{width:"100%",background:colors.btnSecondary,color:colors.text,padding:13,fontSize:14,marginTop:4}}>Cerrar</button>
        </div>
      </div>
      {ticketAbierto&&<FacturaModal ticket={ticketAbierto} onClose={()=>setTicketAbierto(null)} onEliminar={()=>eliminarTicket(ticketAbierto.id)} askConfirm={askConfirm} colors={colors}/>}
    </>);
  }

  function TicketFinalizadoModal({ticket,onClose,colors}) {
    return <FacturaModal ticket={ticket} onClose={onClose} soloVer={true} colors={colors}/>;
  }

  // ── ComprasCardInline ─────────────────────────────────────────────────────────
  function ComprasCardInline({p,cat,stock,stockTotal,guardarStock,mesesRestantes,fmtMeses,guardar,productos,showToast,agregarAlTicket,colors}) {
    const [open,setOpen]=useState(false);
    const [precio,setPrecio]=useState("");
    const [cantidad,setCantidad]=useState(p.cantidadRef?String(p.cantidadRef):"");
    const [cantRollos,setCantRollos]=useState(p.rollosRef?String(p.rollosRef):"");
    const [cantMetros,setCantMetros]=useState(p.metrosRef?String(p.metrosRef):"");
    const [cantComprada,setCantComprada]=useState("1");
    const [saving,setSaving]=useState(false);

    const esM=p.unidad==="m";
    const entradasGuardadas=stock[p.id]||[];
    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses,true);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";
    const hist=p.historialCompra||[];
    const ultimoPrecio=hist.length>0?hist[hist.length-1].precio:null;
    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};

    const precioNum=parseFloat((precio||"").replace(",","."));
    const cantRollosNum=esM?(parseInt(cantRollos)||0):0;
    const cantMetrosNum=esM?(parseFloat(cantMetros)||0):0;
    const cantCompradaNum=parseFloat((cantComprada||"").replace(",","."))||1;
    const metrosPorPaq=cantRollosNum*cantMetrosNum;
    const cantNum=esM?metrosPorPaq*cantCompradaNum:parseFloat((cantidad||"").replace(",","."));
    const cantDisplay=esM&&cantRollosNum>0&&cantMetrosNum>0?`${cantRollosNum}x${cantMetrosNum}`:null;
    const cantRefNum=p.cantidadRef;
    const equivalente=esM
      ?(precioNum>0&&metrosPorPaq>0&&cantRefNum?(precioNum/metrosPorPaq)*cantRefNum:null)
      :(precioNum>0&&cantNum>0&&cantRefNum?(precioNum/cantNum)*cantRefNum:null);
    const diff=equivalente!=null&&p.precioRef?((equivalente-p.precioRef)/p.precioRef*100):null;
    const totalPagado=precioNum>0&&cantCompradaNum>0?precioNum*cantCompradaNum:null;
    const precioRefEquiv=cantRefNum&&cantNum>0&&p.precioRef?(p.precioRef/cantRefNum)*cantNum:p.precioRef;
    const totalRef=precioRefEquiv!=null&&cantCompradaNum>0?precioRefEquiv*cantCompradaNum:null;

    const doRegistrar=async()=>{
      if(!precioNum||precioNum<=0)return showToast("Precio inválido","err");
      setSaving(true);
      try {
        const cantGuardada=esM?String(cantNum):cantidad||null;
        const fecha=todayISO();
        const entrada={id:uid(),precio:precioNum,cantidad:cantGuardada,equivalente,fecha};
        agregarAlTicket({
          prodId:p.id,nombre:p.nombre,marca:p.marca,cantRef:cantNum||cantRefNum,rollosRef:esM?(parseInt(cantRollos)||null):null,metrosRef:esM?(parseFloat(cantMetros)||null):null,
          cantDisplay,unidad:p.unidad,precio:precioNum,equivalente,precioRef:p.precioRef,fecha,
          cantComprada:cantCompradaNum,totalPagado,totalRef,
          entrada,
          stockDelta:{cantRef:cantNum||cantRefNum,cantRefProd:cantRefNum,cantidad:cantCompradaNum,entradasBase:entradasGuardadas,rollosRef:esM?(parseInt(cantRollos)||null):null,metrosRef:esM?(parseFloat(cantMetros)||null):null}
        });
        showToast("✅ Agregado al ticket");
        setOpen(false);
      } catch(e){showToast("Error al guardar","err");}
      finally{setSaving(false);}
    };

    return (<>
      <div className="card" style={{borderLeft:`3px solid ${cat?.color||"#444"}`}}>
        <div style={{padding:"12px 14px",display:"flex",alignItems:"stretch",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{fontWeight:600,fontSize:15,color:colors.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:1,marginRight:8}}>{p.nombre}</div>
              <div style={{fontSize:12,fontWeight:700,color:urgColor,flexShrink:0,textAlign:"right"}}>{mesesTxt}</div>
            </div>
            <div style={{fontSize:12,color:colors.textMuted,marginTop:2,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6}}>{fmtCantRef(p)}</span>}</span>
              <span>Stock: <span className="mono" style={{fontWeight:700,color:colors.text,fontSize:13}}>{fmtTotal(total)}</span></span>
            </div>
            <div style={{marginTop:4,display:"flex",gap:10}}>
              {p.precioRef&&<span style={{fontSize:12,color:colors.textMuted}}>Ref: <span style={{color:cat?.color||"#3b82f6",fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(p.precioRef)}</span></span>}
              {ultimoPrecio&&<span style={{fontSize:12,color:colors.textMuted}}>Último: <span style={{color:colors.text,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(ultimoPrecio)}</span></span>}
            </div>
          </div>
          <button onClick={()=>setOpen(true)} style={{width:38,alignSelf:"center",height:38,borderRadius:10,background:colors.accent,border:"none",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:600,flexShrink:0}}>+</button>
        </div>
      </div>
      {open&&(
        <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:1500,overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 20px"}} onClick={e=>e.target===e.currentTarget&&setOpen(false)}>
          <div style={{background:colors.card,borderRadius:16,padding:"20px",width:"100%",maxWidth:400,border:`1px solid ${cat?.color||"#2a3550"}`,boxShadow:`0 8px 32px ${colors.shadowSoft}`}}>
            {/* Header: nombre + marca + stock */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
              <div style={{fontWeight:700,fontSize:17,color:colors.text}}>{p.nombre}</div>
              <div style={{fontSize:13,color:colors.textMuted,textAlign:"right",marginLeft:8}}>{p.marca||"—"}</div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontSize:12,color:colors.textMuted}}>{p.precioRef&&<span>Ref: <span style={{color:cat?.color||"#3b82f6",fontWeight:700}}>{fmt(p.precioRef)}</span></span>}</div>
              <div style={{fontSize:12,color:colors.textMuted,textAlign:"right"}}>Stock: <span className="mono" style={{fontWeight:700,color:urgColor}}>{fmtTotal(total)}</span> · <span style={{color:urgColor}}>{mesesTxt}</span></div>
            </div>
            {esM?(
              <div style={{marginBottom:14}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:6,alignItems:"end"}}>
                  <div><div style={{fontSize:10,color:colors.textMuted,marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Precio $</div><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="1000" value={precio} onChange={e=>setPrecio(e.target.value)} autoFocus/></div>
                  <div style={{width:60}}>
                    <div style={{fontSize:10,color:colors.textMuted,marginBottom:3,fontWeight:600,textTransform:"uppercase",textAlign:"center"}}>{p.rollosRef||"Rollos"}</div>
                    <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder={p.rollosRef?String(p.rollosRef):"3"} value={cantRollos} onChange={e=>setCantRollos(e.target.value)} style={{textAlign:"center"}}/>
                  </div>
                  <div style={{display:"flex",alignItems:"flex-end",paddingBottom:10,color:colors.textMuted,fontSize:14}}>×</div>
                  <div style={{width:60}}>
                    <div style={{fontSize:10,color:colors.textMuted,marginBottom:3,fontWeight:600,textTransform:"uppercase",textAlign:"center"}}>{p.metrosRef||"Metros"}</div>
                    <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder={p.metrosRef?String(p.metrosRef):"40"} value={cantMetros} onChange={e=>setCantMetros(e.target.value)} style={{textAlign:"center"}}/>
                  </div>
                </div>

    const [modo,setModo]=useState("login"); // login | registro

    const [password2,setPassword2]=useState("");
    const [nombre,setNombre]=useState("");
    const [loading,setLoading]=useState(false);
    const [error,setError]=useState("");
    const [checkEmail,setCheckEmail]=useState(false);

    const submit=async()=>{
      setError("");
      if(!email||!password){setError("Completá email y contraseña.");return;}
      if(modo==="registro"){
        if(password.length<6){setError("La contraseña tiene que tener al menos 6 caracteres.");return;}
        if(password!==password2){setError("Las contraseñas no coinciden.");return;}
      }
      setLoading(true);
      try{
        if(modo==="registro"){
          const redirectTo=window.location.origin+window.location.pathname;
          const {data,error:err}=await sb.auth.signUp({email:email.trim(),password,options:{data:{nombre:nombre.trim()},emailRedirectTo:redirectTo}});
          if(err){setError(err.message);setLoading(false);return;}
          if(!data.session){
            setCheckEmail(true);setLoading(false);return;
          }
          onAuthed();
        } else {
          const {error:err}=await sb.auth.signInWithPassword({email:email.trim(),password});
          if(err){setError(err.message==="Invalid login credentials"?"Email o contraseña incorrectos.":err.message);setLoading(false);return;}
          onAuthed();
        }
      }catch(e){setError(e.message||"Error inesperado.");setLoading(false);}

      </div>);
    }

    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:colors.bg}}>
        <div className="card fade" style={{padding:28,maxWidth:380,width:"100%"}}>
          <div style={{textAlign:"center",marginBottom:22}}>
            <div style={{fontSize:30,marginBottom:6}}>🧺</div>
            <div style={{fontSize:19,fontWeight:700,color:colors.text}}>Canasta</div>
          </div>
          {inviteInfo&&<div style={{background:colors.btnSecondary,border:`1px solid ${colors.cardBorder}`,borderRadius:10,padding:"10px 12px",fontSize:12.5,color:colors.text,marginBottom:16,lineHeight:1.4}}>
            👨‍👩‍👧 Te invitaron a unirte a <b>{inviteInfo.nombre}</b>. Iniciá sesión o creá una cuenta para sumarte.
          </div>}
          <div style={{display:"flex",gap:8,marginBottom:18,background:colors.inputBg,borderRadius:10,padding:4}}>
            <button className="btn" onClick={()=>{setModo("login");setError("");}} style={{flex:1,padding:"8px 0",fontSize:13,background:modo==="login"?colors.card:"none",color:modo==="login"?colors.accent:colors.textMuted}}>Iniciar sesión</button>
            <button className="btn" onClick={()=>{setModo("registro");setError("");}} style={{flex:1,padding:"8px 0",fontSize:13,background:modo==="registro"?colors.card:"none",color:modo==="registro"?colors.accent:colors.textMuted}}>Crear cuenta</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {modo==="registro"&&<div className="field"><label>Nombre</label><input className="inp" autoComplete="canasta-field-ignore" value={nombre} onChange={e=>setNombre(e.target.value)}/></div>}

              <label>Contraseña</label>

              {modo==="registro"&&<div style={{fontSize:11,color:colors.textMuted,marginTop:2}}>Mínimo 6 caracteres</div>}
            </div>
