  function App({session,pendingInvite,onInviteHandled}) {
    const userId=session.user.id;
    const [cats,setCats]=useState(DEFAULT_CATS);
    const [productos,setProductos]=useState([]);
    const [stock,setStock]=useState({});
    const [loaded,setLoaded]=useState(false);
    const [grupoId,setGrupoId]=useState(null);
    const [grupoInfo,setGrupoInfo]=useState(null); // {id,nombre,codigo_invitacion,rol,miembros:[]}
    const [activeTab,setActiveTab]=useState("productos");
    const [stack,setStack]=useState([{screen:"home"}]);
    const [toast,setToast]=useState(null);
    const [confirm,setConfirm]=useState(null);
    const [confirmCompra,setConfirmCompra]=useState(null);
    const [isDarkMode,setIsDarkMode]=useState(()=>{try{return localStorage.getItem("canasta_dark_mode")!=="false";}catch{return true;}});
    const TICKET_KEY="canasta_ticket_draft";
    const PROMO_KEY="canasta_promo_draft";
    const ticketGuardado=()=>{try{const t=localStorage.getItem(TICKET_KEY);return t?JSON.parse(t):null;}catch{return null;}};
    const promoGuardada=()=>{try{const p=localStorage.getItem(PROMO_KEY);return p?JSON.parse(p):null;}catch{return null;}};
    const draft=ticketGuardado();
    const [modoCompras,setModoCompras]=useState(!!draft&&draft.length>0);
    const [ticket,setTicket]=useState(draft||[]);
    const [promo,setPromo]=useState(()=>(draft&&draft.length>0)?promoGuardada():null);
    const [showPromoModal,setShowPromoModal]=useState(false);
    const [ticketOpen,setTicketOpen]=useState(!!draft&&draft.length>0);
    const [tickets,setTickets]=useState([]);
    const [showHistorial,setShowHistorial]=useState(false);
    const [ticketFinalizado,setTicketFinalizado]=useState(null);
    const [showIniciarCompra,setShowIniciarCompra]=useState(false);
    const [showItemSuelto,setShowItemSuelto]=useState(false);
    const [showNuevoProdModal,setShowNuevoProdModal]=useState(false);

    const toggleDarkMode=()=>{const newMode=!isDarkMode;setIsDarkMode(newMode);try{localStorage.setItem("canasta_dark_mode",String(newMode));}catch(e){}};
    const colors=getColors(isDarkMode);

    // Guardar ticket en localStorage cada vez que cambia
    useEffect(()=>{
      try{
        if(ticket.length>0) localStorage.setItem(TICKET_KEY,JSON.stringify(ticket));
        else localStorage.removeItem(TICKET_KEY);
      }catch(e){}
    },[ticket]);

    // Guardar promo en localStorage cada vez que cambia
    useEffect(()=>{
      try{
        if(promo) localStorage.setItem(PROMO_KEY,JSON.stringify(promo));
        else localStorage.removeItem(PROMO_KEY);
      }catch(e){}
    },[promo]);

    // Aplicar CSS variables dinámicamente
    useEffect(()=>{
      const root=document.documentElement;
      Object.entries(colors).forEach(([key,value])=>{
        root.style.setProperty(`--${key}`,value);
      });
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content",colors.bg);
    },[colors]);

    const current=stack[stack.length-1];
    const push=(screen,params={})=>setStack(s=>[...s,{screen,...params}]);
    const pop=()=>setStack(s=>s.length>1?s.slice(0,-1):s);

    // Si se elimina una categoría que está referenciada en el stack de navegación
    // (por ejemplo, la categoría en la que estabas parado), cortamos el stack
    // antes de esa pantalla para evitar quedar en una pantalla en blanco/negra.
    useEffect(()=>{
      setStack(s=>{
        const idx=s.findIndex(f=>f.catId&&!cats.some(c=>c.id===f.catId));
        if(idx===-1)return s;
        return idx===0?[{screen:"home"}]:s.slice(0,idx);
      });
    },[cats]);

    // Busca el grupo del usuario o le crea uno personal si es la primera vez
    const ensureMiGrupo=async()=>{
      const {data:gm,error:errGm}=await sb.from("grupo_miembros").select("grupo_id,rol").eq("user_id",userId).maybeSingle();
      if(errGm){console.error("Error leyendo membresía de grupo:",errGm);return null;}
      if(gm) return gm.grupo_id;
      const nuevoId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());
      const {error:errG}=await sb.from("grupos").insert({id:nuevoId,nombre:"Mi grupo",creado_por:userId});
      if(errG){console.error("Error creando grupo:",errG);return null;}
      const {error:errGm2}=await sb.from("grupo_miembros").insert({grupo_id:nuevoId,user_id:userId,rol:"admin",email:session.user.email});
      if(errGm2){console.error("Error asignando membresía:",errGm2);return null;}
      return nuevoId;
    };

    const cargarInfoGrupo=async(gId)=>{
      try{
        const {data:g,error:errG}=await sb.from("grupos").select("*").eq("id",gId).maybeSingle();
        if(errG) console.error("Error cargando grupo:",errG);
        const {data:miembros,error:errM}=await sb.from("grupo_miembros").select("user_id,rol,email").eq("grupo_id",gId).order("created_at");
        if(errM) console.error("Error cargando miembros:",errM);
        const miGm=(miembros||[]).find(m=>m.user_id===userId);
        setGrupoInfo({id:gId,nombre:g?.nombre||"Mi grupo",codigo_invitacion:g?.codigo_invitacion,rol:miGm?.rol||"admin",miembros:miembros||[]});
      }catch(e){
        console.error("Error inesperado cargando grupo:",e);
        setGrupoInfo({id:gId,nombre:"Mi grupo",codigo_invitacion:null,rol:"admin",miembros:[],error:true});
      }
    };

    useEffect(()=>{
      (async()=>{
        try {
          const [gId, { data: catRows }, { data: prodRows }] = await Promise.all([
            ensureMiGrupo(),
            sb.from("categorias").select("*"),
            sb.from("productos").select("*")
          ]);
          setGrupoId(gId);
          if(gId) cargarInfoGrupo(gId);
          if (catRows && catRows.length) {
            const lc = catRows.map(r=>({id:r.id,label:r.label,emoji:r.emoji,color:r.color,subs:r.subs||[]}));
            const validSubs = new Set(lc.flatMap(c=>c.subs.map(s=>s.id)));
            const lp = (prodRows||[]).map(r=>{
              let cr=r.cantidad_ref;
              let rollosRef=r.rollos_ref||null, metrosRef=r.metros_ref||null;
              // Migración: si no tiene rollos_ref pero tiene cantidad_ref_display, extraer
              if(r.unidad==="m"&&!rollosRef&&r.cantidad_ref_display&&/^\d+x\d+/.test(r.cantidad_ref_display)){
                const parts=r.cantidad_ref_display.split("x");
                rollosRef=parseFloat(parts[0])||null;
                metrosRef=parseFloat(parts[1])||null;
              }
              if(cr!=null&&typeof cr==="string"){cr=parseQty(cr);}
              return {
                id:r.id, nombre:r.nombre, marca:r.marca||"", catId:r.cat_id, subId:r.sub_id&&validSubs.has(r.sub_id)?r.sub_id:null,
                precioRef:r.precio_ref, unidadesMes:r.unidades_mes,
                cantidadRef:cr, rollosRef, metrosRef, unidad:r.unidad||"gr",
                historialCompra:r.historial_compra||[]
              };
            });
            setCats(lc); setProductos(lp);
            // Cargar stock
            const { data: stockRows } = await sb.from("stock").select("*");
            if (stockRows) {
              const sm = {};
              stockRows.forEach(r=>{ sm[r.producto_id]=r.entradas||[]; });
              setStock(sm);
            }
            // Cargar tickets (tabla puede no existir aún)
            try {
              const { data: ticketRows } = await sb.from("tickets").select("*").order("fecha",{ascending:false}).limit(5);
              if (ticketRows) setTickets(ticketRows);
            } catch(e){ console.warn("Tabla tickets no disponible:", e); }
          } else {
            // Primera vez con este grupo: arranca completamente vacío, sin categorías por defecto
            setCats([]); setProductos([]);
          }
        } catch(e) { console.error(e); setProductos(DEFAULT_PRODUCTOS); }
        setLoaded(true);
      })();
    },[]);

    const guardar=async(nextCats,nextProds,opts={})=>{
      const nc=nextCats??cats; const np=nextProds??productos;
      setCats(nc); setProductos(np);
      try {
        if (nextCats) {
          const catRes=await sb.from("categorias").upsert(
            nc.map(c=>({id:c.id,label:c.label,emoji:c.emoji,color:c.color,subs:c.subs,grupo_id:grupoId}))
          );
          if(catRes.error) { console.error("Error guardando cats:",catRes.error); showToast("Error guardando categorías","err"); return; }
          const ncIds = nc.map(c=>c.id);
          const oldIds = cats.map(c=>c.id).filter(id=>!ncIds.includes(id));
          if (oldIds.length) await sb.from("categorias").delete().in("id", oldIds);
        }
        if (nextProds) {
          console.log("Guardando",np.length,"productos en Supabase...");
          // Supabase tiene límite de ~1000 filas por upsert — dividir en chunks
          const CHUNK=100;
          for(let i=0;i<np.length;i+=CHUNK){
            const chunk=np.slice(i,i+CHUNK);
            const res=await sb.from("productos").upsert(
              chunk.map(p=>{
                let cr=p.cantidadRef;
                if(cr!=null&&typeof cr==="string"){
                  cr=parseQty(cr);
                }
                return {id:p.id,nombre:p.nombre,marca:p.marca||"",cat_id:p.catId,sub_id:p.subId||null,
                  precio_ref:p.precioRef,unidades_mes:p.unidadesMes,cantidad_ref:cr||null,rollos_ref:p.rollosRef||null,metros_ref:p.metrosRef||null,
                  unidad:p.unidad||"gr",historial_compra:p.historialCompra||[],grupo_id:grupoId};
              })
            );
            if(res.error){ console.error(`Error en chunk ${i}-${i+CHUNK}:`,res.error); showToast("Error guardando productos","err"); return; }
          }
          console.log("Guardado exitoso:",np.length,"productos");
          if (opts.deleteRemoved) {
            const npIds = np.map(p=>p.id);
            const oldPIds = productos.map(p=>p.id).filter(id=>!npIds.includes(id));
            if (oldPIds.length) await sb.from("productos").delete().in("id", oldPIds);
          }
        }
      } catch(e) { console.error("Supabase error:", e); showToast("Error al guardar: "+e.message,"err"); }
    };

    const showToast=(msg,tipo="ok")=>{setToast({msg,tipo});setTimeout(()=>setToast(null),2400);};
    const askConfirm=(msg,onOk,okLabel="Confirmar",okColor="#3b82f6")=>setConfirm({msg,onOk,okLabel,okColor});
    const getCat=(id)=>cats.find(c=>c.id===id);
    const getSub=(catId,subId)=>getCat(catId)?.subs?.find(s=>s.id===subId);
    const gastoMensual=(p)=>(p.precioRef&&p.unidadesMes)?p.precioRef*p.unidadesMes:null;

    const guardarStock=async(prodId,nuevasEntradas)=>{
      setStock(s=>({...s,[prodId]:nuevasEntradas}));
      try {
        await sb.from("stock").upsert({producto_id:prodId,entradas:nuevasEntradas,actualizado:new Date().toISOString(),grupo_id:grupoId},{onConflict:"producto_id"});
      } catch(e){console.error("Stock save error:",e);}
    };

    // Unirse a un grupo por código de invitación (llega por link #join/CODIGO)
    useEffect(()=>{
      if(!grupoId||!pendingInvite) return;
      (async()=>{
        const {data:targetRows}=await sb.rpc("buscar_grupo_por_codigo",{codigo:pendingInvite});
        const target=targetRows&&targetRows[0]?targetRows[0]:null;
        if(onInviteHandled) onInviteHandled();
        if(!target){showToast("El link de invitación no es válido","err");return;}
        if(target.id===grupoId){showToast("Ya formás parte de este grupo");return;}
        askConfirm(
          `¿Salir de "${grupoInfo?.nombre||"tu grupo"}" y unirte a "${target.nombre}"? Vas a empezar a compartir la base de datos de ese grupo.`,
          async()=>{
            await sb.from("grupo_miembros").delete().eq("user_id",userId);
            await sb.from("grupo_miembros").insert({grupo_id:target.id,user_id:userId,rol:"miembro",email:session.user.email});
            showToast("Te uniste a "+target.nombre);
            setTimeout(()=>window.location.reload(),700);
          },"Unirme","#3b82f6"
        );
      })();
    },[grupoId,pendingInvite]);

    const salirDelGrupo=()=>{
      askConfirm(
        "¿Salir del grupo? Vas a pasar a tener tu propia base de datos individual, con una copia de los productos y categorías actuales. Los demás miembros del grupo no se ven afectados.",
        async()=>{
          try{
            const nuevoId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());
            const {error:errG}=await sb.from("grupos").insert({id:nuevoId,nombre:"Mi grupo",creado_por:userId});
            if(errG) throw errG;
            // Copiar categorías y productos actuales al nuevo grupo personal
            if(cats.length) await sb.from("categorias").insert(cats.map(c=>({id:crypto.randomUUID?crypto.randomUUID():(c.id+"_"+Date.now()),label:c.label,emoji:c.emoji,color:c.color,subs:c.subs,grupo_id:nuevoId})));
            await sb.from("grupo_miembros").delete().eq("user_id",userId);
            await sb.from("grupo_miembros").insert({grupo_id:nuevoId,user_id:userId,rol:"admin",email:session.user.email});
            showToast("Saliste del grupo");
            setTimeout(()=>window.location.reload(),700);
          }catch(e){console.error(e);showToast("Error al salir del grupo","err");}
        },"Salir del grupo","#ef4444"
      );
    };

    const expulsarMiembro=(memberUserId)=>{
      askConfirm("¿Expulsar a este miembro del grupo? Va a pasar a tener su propia base de datos individual.",async()=>{
        try{
          await sb.from("grupo_miembros").delete().eq("user_id",memberUserId).eq("grupo_id",grupoId);
          showToast("Miembro expulsado");
          cargarInfoGrupo(grupoId);
        }catch(e){console.error(e);showToast("Error al expulsar","err");}
      },"Expulsar","#ef4444");
    };

    const regenerarCodigo=async()=>{
      const nuevoCodigo=Math.random().toString(36).slice(2,10);
      const {error:err}=await sb.from("grupos").update({codigo_invitacion:nuevoCodigo}).eq("id",grupoId);
      if(err){showToast("Error al generar nuevo código","err");return;}
      showToast("Nuevo link generado");
      cargarInfoGrupo(grupoId);
    };

    const renombrarGrupo=async(nuevoNombre)=>{
      if(!nuevoNombre||!nuevoNombre.trim())return;
      const {error:err}=await sb.from("grupos").update({nombre:nuevoNombre.trim()}).eq("id",grupoId);
      if(err){showToast("Error al renombrar","err");return;}
      cargarInfoGrupo(grupoId);
    };

    const cerrarSesion=async()=>{
      await sb.auth.signOut();
      window.location.reload();
    };

    // Calcula total en unidades de referencia del producto
    const stockTotal=(p)=>{
      try {
        const entradas=stock[p.id]||[];
        const cantRefNum=typeof p.cantidadRef==="string"?parseQty(p.cantidadRef):(p.cantidadRef||0);
        if(!cantRefNum||cantRefNum===0) return entradas.reduce((s,e)=>s+(e.stock||0),0);
        return entradas.reduce((s,e)=>{
          const eCantRef=typeof e.cantRef==="string"?parseQty(String(e.cantRef)):(e.cantRef||cantRefNum);
          return s+((e.stock||0)*((eCantRef||cantRefNum)/cantRefNum));
        },0);
      } catch(err){ return 0; }
    };

    const mesesRestantes=(p)=>{
      const total=stockTotal(p);
      if(!p.unidadesMes||p.unidadesMes===0)return null;
      return total/p.unidadesMes;
    };
    const fmtMeses=(m,corto=false)=>{
      if(m===null)return "Sin consumo definido";
      if(m===0)return "Sin stock";
      if(m<1)return "menos de 1 mes";
      const r=Math.round(m*10)/10;
      const mesesStr=r===1?"1 mes":`${r} meses`;
      return corto?mesesStr:`Queda para ${mesesStr}`;
    };
    const handleExport=async(catId=null,subId=null)=>{
      const text=buildExportText(cats,productos,catId,subId);
      if(!text)return showToast("No hay productos para exportar","err");
      const ok=await copyToClipboard(text);
      showToast(ok?"📋 Copiado al portapapeles":"No se pudo copiar");
    };

    const agregarAlTicket=(item)=>{
      setTicket(t=>{
        const idx=t.findIndex(x=>x.prodId===item.prodId);
        if(idx>=0){const n=[...t];n[idx]=item;return n;}
        return [...t,item];
      });
      // No abrir el drawer automáticamente — el usuario lo abre cuando quiere
    };

    const agregarItemSuelto=({nombre,precio,cantidad=1})=>{
      setTicket(t=>[...t,{
        prodId:"suelto-"+uid(),nombre,marca:"",cantRef:null,unidad:"",
        precio,equivalente:null,precioRef:null,fecha:todayISO(),
        cantComprada:cantidad,totalPagado:precio*cantidad,totalRef:null,
        suelto:true
      }]);
      setShowItemSuelto(false);
      showToast("✅ Item agregado al ticket");
    };

    const finalizarCompra=async()=>{
      if(ticket.length===0)return;
      askConfirm(`¿Finalizar compra con ${ticket.length} producto${ticket.length>1?"s":""}?`,async()=>{
        const subtotal=ticket.reduce((s,i)=>s+(i.totalPagado??i.precio??0),0);
        const promoCalc=calcPromo(subtotal,promo);
        const promoAplicado=promo&&promoCalc.descuentoAplicado>0;
        // Si hay promo, "horneamos" el descuento en el precio efectivo de cada producto
        // (no solo en el total): así el historial de precios y el gráfico de cada producto
        // reflejan lo que realmente pagaste, comparable con compras de otros supermercados.
        const itemsFinal=promoAplicado
          ?ticket.map(it=>{
              const f=promoCalc.factor;
              const baseTotal=it.totalPagado??it.precio??0;
              const nuevoTotalPagado=Math.round(baseTotal*f*100)/100;
              const nuevoPrecio=it.precio!=null?Math.round(it.precio*f*100)/100:it.precio;
              const nuevoEquivalente=it.equivalente!=null?Math.round(it.equivalente*f*100)/100:it.equivalente;
              const nuevaEntrada=it.entrada?{...it.entrada,precio:Math.round(it.entrada.precio*f*100)/100,equivalente:it.entrada.equivalente!=null?Math.round(it.entrada.equivalente*f*100)/100:it.entrada.equivalente}:it.entrada;
              return{...it,totalPagado:nuevoTotalPagado,precio:nuevoPrecio,equivalente:nuevoEquivalente,entrada:nuevaEntrada};
            })
          :ticket;
        const promoGuardado=promoAplicado?{pct:promo.pct,limitado:promo.limitado,limite:promo.limite,descuentoAplicado:Math.round(promoCalc.descuentoAplicado*100)/100}:null;
        const nuevoTicket={id:uid(),fecha:new Date().toISOString(),items:itemsFinal,promo:promoGuardado};
        const nuevos=[nuevoTicket,...tickets].slice(0,15);
        setTickets(nuevos);
        setTicket([]);
        setPromo(null);
        setTicketOpen(false);
        setModoCompras(false);
        try{localStorage.removeItem(TICKET_KEY);}catch(e){}
        try{localStorage.removeItem(PROMO_KEY);}catch(e){}
        setTicketFinalizado(nuevoTicket);
        // Guardar en background sin bloquear el modal
        (async()=>{
          let prodActualizados=[...productos];
          for(const item of itemsFinal){
            if(item.entrada){
              prodActualizados=prodActualizados.map(p=>p.id===item.prodId?{...p,historialCompra:[...(p.historialCompra||[]),item.entrada].sort((a,b)=>a.fecha.localeCompare(b.fecha))}:p);
            }
          }
          await guardar(null,prodActualizados);
          for(const item of itemsFinal){
            if(!item.stockDelta||item.stockDelta.cantidad<=0) continue;
            const {cantRef,cantRefProd,cantidad,entradasBase,display}=item.stockDelta;
            const base=entradasBase.length===0&&cantRefProd
              ?[{cantRef:cantRefProd,unidad:item.unidad||"gr",stock:0,display:display||null}]
              :[...entradasBase];
            const idx=base.findIndex(e=>e.cantRef===cantRef);
            let nuevas;
            if(idx>=0){nuevas=base.map((e,i)=>i===idx?{...e,stock:e.stock+cantidad}:e);}
            else{nuevas=[...base,{cantRef,unidad:item.unidad||"gr",stock:cantidad,display:null}];}
            guardarStock(item.prodId,nuevas);
          }
          try {
            await sb.from("tickets").upsert({id:nuevoTicket.id,fecha:nuevoTicket.fecha,items:nuevoTicket.items,promo:nuevoTicket.promo,grupo_id:grupoId});
            if(tickets.length>=15){
              const aEliminar=tickets.slice(14).map(t=>t.id);
              if(aEliminar.length) await sb.from("tickets").delete().in("id",aEliminar);
            }
          } catch(e){console.warn("Ticket save error:",e);}
        })();
      },"Finalizar","#10b981");
    };

    const cancelarCompra=()=>{
      if(ticket.length===0){setTicketOpen(false);setModoCompras(false);setPromo(null);return;}
      askConfirm("¿Cancelar la compra? Se perderán los items del ticket.",()=>{
        setTicket([]);setPromo(null);setTicketOpen(false);setModoCompras(false);
        try{localStorage.removeItem(TICKET_KEY);}catch(e){}
        try{localStorage.removeItem(PROMO_KEY);}catch(e){}
      },"Cancelar compra","#ef4444");
    };

    if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:colors.accent,fontFamily:"monospace"}}>Cargando…</div>;

    const s=current.screen;
    const shared={cats,productos,guardar,showToast,askConfirm,push,pop,gastoMensual,getCat,getSub,handleExport,stock,guardarStock,stockTotal,mesesRestantes,fmtMeses,modoCompras,ticket,agregarAlTicket,setShowHistorial,setConfirmCompra,colors,isDarkMode,toggleDarkMode,session,grupoInfo,grupoId,cargarInfoGrupo,salirDelGrupo,expulsarMiembro,regenerarCodigo,renombrarGrupo,cerrarSesion};

    const isMenuScreen=["export","backup","import","config","cuenta","grupo"].includes(s);
    const isFormScreen=["nuevo-prod","editar-prod","nuevo-precio","detalle"].includes(s);

    return (
      <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",minHeight:"100vh",background:colors.bg,color:colors.text}}>
        {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:3000,background:toast.tipo==="err"?colors.error:colors.success,color:"#fff",padding:"9px 20px",borderRadius:10,fontWeight:600,fontSize:13,boxShadow:`0 8px 32px ${colors.shadowSoft}`,whiteSpace:"nowrap",maxWidth:"90vw",textAlign:"center"}}>{toast.msg}</div>}
        {confirm&&<Confirm colors={colors} msg={confirm.msg} onOk={()=>{confirm.onOk();setConfirm(null);}} onCancel={()=>setConfirm(null)} okLabel={confirm.okLabel} okColor={confirm.okColor}/>}
        {confirmCompra&&<ConfirmCompra colors={colors} data={confirmCompra} onOk={()=>{confirmCompra.onOk();setConfirmCompra(null);}} onCancel={()=>setConfirmCompra(null)}/>}
        <div style={{maxWidth:500,margin:"0 auto",padding:`0 16px ${modoCompras?"180px":"100px"}`}}>
          {s==="home"        &&<HomeScreen {...shared} activeTab={activeTab}/>}
          {s==="subs"        &&<SubsScreen {...shared} catId={current.catId} activeTab={activeTab}/>}
          {s==="lista"       &&<ListaScreen {...shared} catId={current.catId} subId={current.subId} activeTab={activeTab}/>}
          {s==="detalle"     &&<DetalleScreen {...shared} prodId={current.prodId}/>}
          {s==="nuevo-prod"  &&<NuevoProdScreen {...shared} initCatId={current.catId} initSubId={current.subId} desdeCompras={current.desdeCompras} agregarAlTicket={agregarAlTicket}/>}
          {s==="editar-prod" &&<EditarProdScreen {...shared} prodId={current.prodId}/>}
          {s==="nuevo-precio"&&<NuevoPrecioScreen {...shared} prodId={current.prodId}/>}
          {s==="config"      &&<ConfigScreen {...shared} openCatId={current.openCatId||null}/>}
          {s==="export"      &&<ExportScreen {...shared}/>}
          {s==="backup"      &&<BackupScreen {...shared}/>}
          {s==="import"      &&<ImportScreen {...shared}/>}
          {s==="cuenta"      &&<CuentaScreen {...shared}/>}
          {s==="grupo"       &&<GrupoFamiliarScreen {...shared}/>}
        </div>
        {!isFormScreen&&!isMenuScreen&&(activeTab==="productos"||activeTab==="stock")&&!modoCompras&&(
          <FloatingAdd colors={colors} onClick={()=>push("nuevo-prod",{catId:current.catId||null,subId:current.subId&&current.subId!==UNASSIGNED_ID?current.subId:null})}/>
        )}
        {modoCompras&&(
          <TicketDrawer colors={colors} ticket={ticket} setTicket={setTicket} productos={productos} cats={cats} ticketOpen={ticketOpen} setTicketOpen={setTicketOpen} onFinalizar={finalizarCompra} onCancelar={cancelarCompra} askConfirm={askConfirm} onAddSuelto={()=>setShowItemSuelto(true)} onAddProducto={()=>setShowNuevoProdModal(true)} promo={promo} onEditPromo={()=>setShowPromoModal(true)} stock={stock} stockTotal={stockTotal} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses}/>
        )}
        {showHistorial&&<HistorialTickets colors={colors} tickets={tickets} setTickets={setTickets} onClose={()=>setShowHistorial(false)} askConfirm={askConfirm}/>}
        {ticketFinalizado&&<TicketFinalizadoModal colors={colors} ticket={ticketFinalizado} onClose={()=>setTicketFinalizado(null)}/>}
        {showIniciarCompra&&(
          <Confirm colors={colors} msg="¿Iniciar compra?" onOk={()=>{setModoCompras(true);setShowIniciarCompra(false);}} onCancel={()=>setShowIniciarCompra(false)} okLabel="Iniciar" okColor={colors.success}/>
        )}
        {showItemSuelto&&<ItemSueltoModal colors={colors} onClose={()=>setShowItemSuelto(false)} onSave={agregarItemSuelto}/>}
        {showPromoModal&&<PromoModal colors={colors} promo={promo} subtotal={ticket.reduce((s,i)=>s+(i.totalPagado??i.precio??0),0)} onClose={()=>setShowPromoModal(false)} onSave={(p)=>{setPromo(p);setShowPromoModal(false);}} onQuitar={()=>{setPromo(null);setShowPromoModal(false);}}/>}
        {showNuevoProdModal&&(
          <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:1500,overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 0 80px"}} onClick={e=>e.target===e.currentTarget&&setShowNuevoProdModal(false)}>
            <div style={{width:"100%",maxWidth:500,background:colors.inputBg}}>
              <NuevoProdScreen cats={cats} initCatId={current.catId||null} initSubId={null} productos={productos} guardar={guardar} pop={()=>setShowNuevoProdModal(false)} showToast={showToast} desdeCompras={true} agregarAlTicket={agregarAlTicket} colors={colors}/>
            </div>
          </div>
        )}
        {!isFormScreen&&<BottomTabs colors={colors} activeTab={activeTab} setActiveTab={(t)=>{setActiveTab(t);if(modoCompras)setModoCompras(false);}} modoCompras={modoCompras} ticketCount={ticket.length} onTapCompras={()=>{
          if(modoCompras){}
          else if(ticket.length>0){ setModoCompras(true); }
          else { setShowIniciarCompra(true); }
        }}/>}
      </div>
    );
  }

  // ── HomeScreen ───────────────────────────────────────────────────────────────
  function HamburgerMenu({push,setShowHistorial,colors,isDarkMode,toggleDarkMode,session}) {
    const [open,setOpen]=useState(false);
    return (
      <div style={{position:"relative"}}>
        <button className="btn" onClick={()=>setOpen(o=>!o)} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:"9px 13px",fontSize:18,lineHeight:1}}>☰</button>
        {open&&<>
          <div style={{position:"fixed",inset:0,zIndex:299}} onClick={()=>setOpen(false)}/>
          <div style={{position:"absolute",right:0,top:"calc(100% + 8px)",background:colors.card,border:`1px solid ${colors.cardBorder}`,borderRadius:12,padding:8,zIndex:300,minWidth:180,boxShadow:`0 8px 32px ${colors.shadowSoft}`}}>
            <button className="btn" onClick={()=>{setOpen(false);push("import");}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>📥 Importar</button>
            <button className="btn" onClick={()=>{setOpen(false);push("export");}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>📋 Exportar</button>
            <button className="btn" onClick={()=>{setOpen(false);push("backup");}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>💾 Backup</button>
            <div style={{borderTop:`1px solid ${colors.cardBorder}`,margin:"4px 0"}}/>
            <button className="btn" onClick={()=>{setOpen(false);setShowHistorial(true);}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>🧾 Historial de compras</button>
            <div style={{borderTop:`1px solid ${colors.cardBorder}`,margin:"4px 0"}}/>
            <button className="btn" onClick={()=>{setOpen(false);push("config");}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>📂 Editar categorías</button>
            <div style={{borderTop:`1px solid ${colors.cardBorder}`,margin:"4px 0"}}/>
            <button className="btn" onClick={()=>{toggleDarkMode();setOpen(false);}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>{isDarkMode?"☀️ Modo cálido":"🌙 Modo oscuro"}</button>
            <div style={{borderTop:`1px solid ${colors.cardBorder}`,margin:"4px 0"}}/>
            <button className="btn" onClick={()=>{setOpen(false);push("grupo");}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>👨‍👩‍👧 Grupo Familiar</button>
            <button className="btn" onClick={()=>{setOpen(false);push("cuenta");}} style={{width:"100%",background:"none",color:colors.text,padding:"10px 14px",textAlign:"left",fontSize:14,display:"flex",gap:10,alignItems:"center"}}>👤 Cuenta</button>
          </div>
        </>}
      </div>
    );
  }

  function HomeScreen({cats,productos,push,gastoMensual,guardar,showToast,activeTab,stock,guardarStock,stockTotal,mesesRestantes,fmtMeses,modoCompras,ticket,agregarAlTicket,askConfirm,setShowHistorial,setConfirmCompra,colors,isDarkMode,toggleDarkMode,session}) {
    const [q,setQ]=useState(""); const [showAddCat,setShowAddCat]=useState(false); const [sortCats,setSortCats]=useState("nombre-az");
    const [menuOpen,setMenuOpen]=useState(false);
    const isStock=activeTab==="stock";
    const total=productos.reduce((s,p)=>s+(gastoMensual(p)||0),0);
    const addCat=async({label,emoji,color})=>{await guardar([...cats,{id:uid(),label,emoji,color,subs:[]}],null);setShowAddCat(false);showToast("✅ Categoría creada");};
    const sortedCats=[...cats].sort((a,b)=>{
      const ga=productos.filter(p=>p.catId===a.id).reduce((s,p)=>s+(gastoMensual(p)||0),0);
      const gb=productos.filter(p=>p.catId===b.id).reduce((s,p)=>s+(gastoMensual(p)||0),0);
      if(sortCats==="nombre-az")return alpha(a,b);
      if(sortCats==="nombre-za")return alpha(b,a);
      if(sortCats==="gasto-asc")return ga-gb;
      if(sortCats==="gasto-desc")return gb-ga;
      return 0;
    });

    const ticketIdsQ=new Set((ticket||[]).map(i=>i.prodId));
    const results=q?productos.filter(p=>norm(p.nombre).includes(norm(q))||norm(p.marca||"").includes(norm(q))).filter(p=>!modoCompras||!ticketIdsQ.has(p.id)):[];
    return (<div className="fade">
      <div style={{padding:"28px 0 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:22,fontWeight:700,letterSpacing:"-.03em",color:colors.text}}>🧺 Canasta</div>
          <div style={{fontSize:12,color:colors.textMuted,marginTop:3}}>{productos.length} productos{!isStock&&!modoCompras&&<> · <span style={{color:colors.accent,fontWeight:600}}>{fmt(total)}/mes</span></>}</div>
        </div>
        {!modoCompras&&<HamburgerMenu push={push} setShowHistorial={setShowHistorial} colors={colors} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} session={session}/>}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="🔍 Buscar en toda la canasta…" value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,marginBottom:0,height:44,boxSizing:"border-box"}}/>
        <select value={sortCats} onChange={e=>setSortCats(e.target.value)} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.textSecondary,borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0,height:44,width:90}}>
          <option value="nombre-az">A→Z</option>
          <option value="nombre-za">Z→A</option>
          {!isStock&&!modoCompras&&<><option value="gasto-desc">Gasto ↓</option><option value="gasto-asc">Gasto ↑</option></>}
        </select>
      </div>
      {q?(
        <>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:10}}>{results.length} resultado{results.length!==1?"s":""} en toda la canasta</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>{[...results].sort((a,b)=>alphaStr(a.nombre,b.nombre)).map(p=>{const cat=cats.find(c=>c.id===p.catId);
            if(isStock&&!modoCompras)return <StockCard key={p.id} p={p} cat={cat} stock={stock} stockTotal={stockTotal} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardarStock={guardarStock} colors={colors}/>;
            if(modoCompras)return <ComprasCardInline key={p.id} p={p} cat={cat} stock={stock} stockTotal={stockTotal} guardarStock={guardarStock} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardar={guardar} productos={productos} showToast={showToast} agregarAlTicket={agregarAlTicket} colors={colors}/>;
            return <ProdCard key={p.id} p={p} cat={cat} gastoMensual={gastoMensual} push={push} colors={colors}/>;
          })}</div>
        </>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {sortedCats.map(cat=>{
            const catProds=productos.filter(p=>p.catId===cat.id);
            const gasto=catProds.reduce((s,p)=>s+(gastoMensual(p)||0),0);
            return (<div key={cat.id} className="card row" style={{padding:"16px 18px",display:"flex",alignItems:"center",gap:14,borderLeft:`4px solid ${cat.color}`}}
              onClick={()=>cat.subs?.length?push("subs",{catId:cat.id}):push("lista",{catId:cat.id,subId:null})}>
              <div style={{fontSize:28}}>{cat.emoji}</div>
              <div style={{flex:1}}><div style={{fontWeight:600,fontSize:16,color:colors.text}}>{cat.label}</div><div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{cat.subs?.length?`${cat.subs.length} subcategorías · `:""}{catProds.length} productos</div></div>
              <div style={{textAlign:"right"}}>{gasto>0&&!isStock&&!modoCompras&&<div className="mono" style={{fontWeight:700,fontSize:15,color:cat.color}}>{fmt(gasto)}<span style={{fontSize:10,color:colors.textMuted}}>/mes</span></div>}<div style={{fontSize:18,color:colors.hoverCard,marginTop:2}}>›</div></div>
            </div>);
          })}
          {!modoCompras&&<button className="btn" onClick={()=>setShowAddCat(true)} style={{background:`${colors.accent}11`,border:`1px solid ${colors.accent}`,color:colors.accent,padding:"13px",fontSize:14,marginTop:14,width:"100%",fontWeight:600}}>+ Agregar categoría</button>}
        </div>
      )}
      {showAddCat&&<AddModal colors={colors} title="Nueva categoría" namePlaceholder="ej. Panadería" onClose={()=>setShowAddCat(false)} onSave={addCat} showColor={true}/>}
    </div>);
  }

  // ── SubsScreen ───────────────────────────────────────────────────────────────
  function SubsScreen({cats,catId,productos,push,pop,gastoMensual,guardar,showToast,handleExport,activeTab,stock,guardarStock,stockTotal,mesesRestantes,fmtMeses,modoCompras,ticket,agregarAlTicket,askConfirm,setConfirmCompra,setShowHistorial,colors,isDarkMode,toggleDarkMode,session}) {
    const [q,setQ]=useState(""); const [showAddSub,setShowAddSub]=useState(false);
    const [sortBy,setSortBy]=useState("nombre-az");
    const isStock=activeTab==="stock"; 
    const cat=cats.find(c=>c.id===catId); if(!cat) return null;
    const catGasto=productos.filter(p=>p.catId===catId).reduce((s,p)=>s+(gastoMensual(p)||0),0);
    const addSub=({label})=>{guardar(cats.map(c=>c.id===catId?{...c,subs:[...c.subs,{id:uid(),label}]}:c),null);setShowAddSub(false);showToast("✅ Subcategoría creada");};

    const validSubIds=new Set(cat.subs.map(s=>s.id));
    const orphans=cat.subs.length>0
      ? productos.filter(p=>p.catId===catId&&(!p.subId||!validSubIds.has(p.subId)))
      : [];
    const orphanGasto=orphans.reduce((s,p)=>s+(gastoMensual(p)||0),0);

    const SortSelect=()=>(
      <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.textSecondary,borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0,height:44,width:90}}>
        <option value="nombre-az">A→Z</option><option value="nombre-za">Z→A</option>
        {!isStock&&!modoCompras&&<><option value="precio-asc">Precio ↑</option><option value="precio-desc">Precio ↓</option>
        <option value="gasto-asc">Gasto ↑</option><option value="gasto-desc">Gasto ↓</option></>}
      </select>
    );

    const ticketIdsQS=new Set((ticket||[]).map(i=>i.prodId));
    const resultsQ=q?productos.filter(p=>norm(p.nombre).includes(norm(q))||norm(p.marca||"").includes(norm(q))).filter(p=>!modoCompras||!ticketIdsQS.has(p.id)):[];

    return (<div className="fade">
      <TopBar colors={colors} title={`${cat.emoji} ${cat.label}`} subtitle={!isStock&&!modoCompras&&catGasto>0?<span style={{color:colors.accent,fontWeight:600}}>{fmt(catGasto)}/mes</span>:undefined} onBack={pop}
        right={<div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>push("lista",{catId,subId:null})} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.textSecondary,padding:"8px 11px",fontSize:12}}>Ver todos</button>
          {!modoCompras&&<HamburgerMenu push={push} setShowHistorial={setShowHistorial} colors={colors} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} session={session}/>}
        </div>}/>
      <SearchRow colors={colors} q={q} onChange={setQ} sortValue={sortBy} onSort={setSortBy} sortOptions={<>
        <option value="nombre-az">A→Z</option><option value="nombre-za">Z→A</option>
        {!isStock&&!modoCompras&&<><option value="precio-asc">Precio ↑</option><option value="precio-desc">Precio ↓</option>
        <option value="gasto-asc">Gasto ↑</option><option value="gasto-desc">Gasto ↓</option></>}
      </>}/>
      {q?(<>
        <div style={{fontSize:12,color:colors.textMuted,marginBottom:10}}>{resultsQ.length} resultado{resultsQ.length!==1?"s":""} en toda la canasta</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>{resultsQ.map(p=>{const pcat=cats.find(c=>c.id===p.catId);
          if(isStock&&!modoCompras)return <StockCard key={p.id} p={p} cat={pcat} stock={stock} stockTotal={stockTotal} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardarStock={guardarStock} colors={colors}/>;
          if(modoCompras)return <ComprasCardInline key={p.id} p={p} cat={pcat} stock={stock} stockTotal={stockTotal} guardarStock={guardarStock} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardar={guardar} productos={productos} showToast={showToast} agregarAlTicket={agregarAlTicket} colors={colors}/>;
          return <ProdCard key={p.id} p={p} cat={pcat} gastoMensual={gastoMensual} push={push}/>;
        })}</div>
      </>):(<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>{
          const subProds=productos.filter(p=>p.catId===catId&&p.subId===sub.id);
          const gasto=subProds.reduce((s,p)=>s+(gastoMensual(p)||0),0);
          return (<div key={sub.id} className="card row" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12,borderLeft:`3px solid ${cat.color}`}} onClick={()=>push("lista",{catId,subId:sub.id})}>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15,color:colors.text}}>{sub.label}</div><div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{subProds.length} productos</div></div>
            <div style={{textAlign:"right"}}>{gasto>0&&!isStock&&!modoCompras&&<div className="mono" style={{fontWeight:600,fontSize:14,color:cat.color}}>{fmt(gasto)}<span style={{fontSize:10,color:colors.textMuted}}>/mes</span></div>}<div style={{fontSize:18,color:colors.hoverCard}}>›</div></div>
          </div>);
        })}
        {orphans.length>0&&(
          <div className="card row" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12,borderLeft:"3px solid #4a5568",opacity:0.85}} onClick={()=>push("lista",{catId,subId:"__sin_sub__"})}>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:15,color:colors.textSecondary}}>Sin subcategoría</div>
              <div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{orphans.length} producto{orphans.length!==1?"s":""} sin asignar · usá Selec. para moverlos</div>
            </div>
            <div style={{textAlign:"right"}}>
              {orphanGasto>0&&!isStock&&!modoCompras&&<div className="mono" style={{fontWeight:600,fontSize:14,color:colors.textSecondary}}>{fmt(orphanGasto)}<span style={{fontSize:10,color:colors.textMuted}}>/mes</span></div>}
              <div style={{fontSize:18,color:colors.hoverCard}}>›</div>
            </div>
          </div>
        )}
        {!modoCompras&&<button className="btn" onClick={()=>setShowAddSub(true)} style={{background:cat.color+"11",border:`1px solid ${cat.color}`,color:cat.color,padding:"13px",fontSize:14,marginTop:14,width:"100%",fontWeight:600}}>+ Agregar subcategoría</button>}
      </div>)}
      {showAddSub&&<AddModal colors={colors} title={`Nueva subcategoría en ${cat.label}`} namePlaceholder="ej. Personal" onClose={()=>setShowAddSub(false)} onSave={addSub} showColor={false} accentColor={cat.color}/>}
    </div>);
  }
  function ListaScreen({cats,catId,subId,productos,guardar,push,pop,gastoMensual,handleExport,showToast,activeTab,stock,guardarStock,stockTotal,mesesRestantes,fmtMeses,modoCompras,ticket,agregarAlTicket,askConfirm,setConfirmCompra,setShowHistorial,colors,isDarkMode,toggleDarkMode,session}) {
    const [q,setQ]=useState("");
    const isStock=activeTab==="stock";
    const defaultSort="nombre-az";
    const [sortBy,setSortBy]=useState(defaultSort); const [selected,setSelected]=useState(new Set());
    const [selectMode,setSelectMode]=useState(false); const [moveModal,setMoveModal]=useState(false); const [moveDest,setMoveDest]=useState("");
    const [openStockId,setOpenStockId]=useState(null); // ID del StockCard abierto
    const [frozenOrder,setFrozenOrder]=useState(null); // orden congelado mientras hay panel abierto
    const cat=cats.find(c=>c.id===catId); const sub=cat?.subs?.find(s=>s.id===subId); if(!cat) return null;
    const isUnassignedView=subId===UNASSIGNED_ID;
    const sortFn = (a,b) => {
      const gma=gastoMensual(a)||0, gmb=gastoMensual(b)||0;
      const ma=mesesRestantes(a), mb=mesesRestantes(b);
      if(sortBy==="nombre-az") return alphaStr(a.nombre,b.nombre);
      if(sortBy==="nombre-za") return alphaStr(b.nombre,a.nombre);
      if(sortBy==="precio-asc") return (a.precioRef||0)-(b.precioRef||0);
      if(sortBy==="precio-desc") return (b.precioRef||0)-(a.precioRef||0);
      if(sortBy==="gasto-asc") return gma-gmb;
      if(sortBy==="gasto-desc") return gmb-gma;
      if(sortBy==="meses-asc") return (ma??Infinity)-(mb??Infinity);
      if(sortBy==="meses-desc") return (mb??Infinity)-(ma??Infinity);
      return 0;
    };
    const ticketIds=new Set((ticket||[]).map(i=>i.prodId));
    const baseLista=productos.filter(p=>{if(p.catId!==catId)return false;if(isUnassignedView)return isUnassignedProd(p,cat);if(subId)return p.subId===subId;return true;}).filter(p=>!modoCompras||!ticketIds.has(p.id));
    const listaOrdenada=[...(q?productos.filter(p=>norm(p.nombre).includes(norm(q))||norm(p.marca||"").includes(norm(q))):baseLista)].sort(sortFn);
    // En stock, congelar el orden mientras hay un panel abierto
    const lista=isStock&&frozenOrder?frozenOrder.filter(p=>listaOrdenada.find(x=>x.id===p.id)):listaOrdenada;
    const handleStockOpen=(id)=>{
      if(!openStockId) setFrozenOrder(listaOrdenada);
      setOpenStockId(id);
    };
    const handleStockClose=()=>{
      setOpenStockId(null);
      setFrozenOrder(null);
    };
    const toggleSelect=(id)=>{setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});};
    const cancelSelect=()=>{setSelectMode(false);setSelected(new Set());};
    const doMove=async()=>{
      if(!moveDest)return;
      const [dCatId,dSubId]=moveDest.split("::");
      const dCat=cats.find(c=>c.id===dCatId); const dSub=dSubId?dCat?.subs?.find(s=>s.id===dSubId):null;
      await guardar(null,productos.map(p=>selected.has(p.id)?{...p,catId:dCatId,subId:dSubId||null}:p));
      showToast(`✅ ${selected.size} producto${selected.size>1?"s":""} movido${selected.size>1?"s":""} a ${dSub?`${dCat?.label} › ${dSub.label}`:dCat?.label}`);
      setMoveModal(false);setMoveDest("");cancelSelect();
    };
    const catGasto=productos.filter(p=>p.catId===catId).reduce((s,p)=>s+(gastoMensual(p)||0),0);
    const title=isUnassignedView?`${cat.emoji} Sin subcategoría`:sub?`${cat.emoji} ${sub.label}`:`${cat.emoji} ${cat.label}`;
    const listSubtitle=sub?cat.label:isUnassignedView?cat.label:(!isStock&&!modoCompras&&catGasto>0)?<span style={{color:colors.accent,fontWeight:600}}>{fmt(catGasto)}/mes</span>:undefined;
    return (<div className="fade">
      {moveModal&&(<div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:colors.card,border:`1px solid ${colors.hoverCard}`,borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontWeight:600,marginBottom:4,color:colors.text}}>Mover {selected.size} producto{selected.size>1?"s":""}</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:14}}>Elegí el destino</div>
          <select className="inp" value={moveDest} onChange={e=>setMoveDest(e.target.value)} style={{marginBottom:16}}>
            <option value="">— Elegir —</option>
            {[...cats].sort((a,b)=>alpha(a,b)).map(c=>[
              <option key={c.id+"::"} value={c.id+"::"} style={{fontWeight:600}}>{c.emoji} {c.label} (sin sub)</option>,
              ...[...c.subs].sort((a,b)=>alpha(a,b)).map(s=><option key={c.id+"::"+s.id} value={c.id+"::"+s.id}>{c.emoji} {c.label} › {s.label}</option>)
            ])}
          </select>
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={()=>{setMoveModal(false);setMoveDest("");}} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:12}}>Cancelar</button>
            <button className="btn" onClick={doMove} style={{flex:1,background:colors.accent,color:"#fff",padding:12}} disabled={!moveDest}>Mover</button>
          </div>
        </div>
      </div>)}
      <TopBar colors={colors} title={title} subtitle={listSubtitle} onBack={()=>{cancelSelect();pop();}}
        right={selectMode&&!isStock&&!modoCompras
          ?<div style={{display:"flex",gap:8,alignItems:"center"}}>
              <div style={{fontSize:13,color:colors.accent,fontWeight:600}}>{selected.size} sel.</div>
              {selected.size>0&&<button className="btn" onClick={()=>setMoveModal(true)} style={{background:colors.accent,color:"#fff",padding:"8px 12px",fontSize:13}}>Mover</button>}
              <button className="btn" onClick={cancelSelect} style={{background:colors.btnSecondary,color:colors.textSecondary,padding:"8px 12px",fontSize:13}}>✕</button>
            </div>
          :<div style={{display:"flex",gap:8}}>
              {!isStock&&!modoCompras&&<button className="btn" onClick={()=>setSelectMode(true)} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.textSecondary,padding:"8px 11px",fontSize:12}}>Selec.</button>}
              {!modoCompras&&<HamburgerMenu push={push} setShowHistorial={setShowHistorial} colors={colors} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} session={session}/>}
            </div>}/>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder={q?"🔍 Buscando en toda la canasta…":"🔍 Buscar en toda la canasta…"} value={q} onChange={v=>{setQ(v.target.value);if(v.target.value)cancelSelect();}} style={{flex:1,marginBottom:0,height:44,boxSizing:"border-box"}}/>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.textSecondary,borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0,height:44,width:90}}>
          <option value="nombre-az">A→Z</option>
          <option value="nombre-za">Z→A</option>
          {(isStock||modoCompras)&&<><option value="meses-asc">Meses ↑</option><option value="meses-desc">Meses ↓</option></>}
          {!isStock&&!modoCompras&&<><option value="precio-asc">Precio ↑</option><option value="precio-desc">Precio ↓</option><option value="gasto-asc">Gasto ↑</option><option value="gasto-desc">Gasto ↓</option></>}
        </select>
      </div>
      {q&&<div style={{fontSize:12,color:colors.textMuted,marginBottom:10}}>{lista.length} resultado{lista.length!==1?"s":""} en toda la canasta</div>}
      {lista.length===0?<div style={{textAlign:"center",color:colors.textMuted,padding:"60px 0",fontSize:14}}>Sin productos aún.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {lista.map(p=>{
            const pcat=q?cats.find(c=>c.id===p.catId):cat;
            if(isStock&&!modoCompras) return <StockCard key={p.id} p={p} cat={pcat} stock={stock} stockTotal={stockTotal} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardarStock={guardarStock} askConfirm={askConfirm} onOpen={()=>handleStockOpen(p.id)} onClose={handleStockClose} colors={colors}/>;
            if(modoCompras) return <ComprasCardInline key={p.id} p={p} cat={pcat} stock={stock} stockTotal={stockTotal} guardarStock={guardarStock} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardar={guardar} productos={productos} showToast={showToast} agregarAlTicket={agregarAlTicket} colors={colors}/>;
            const isSel=selected.has(p.id);
            return (<div key={p.id} className="card" style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,borderLeft:`3px solid ${isSel?colors.accent:pcat?.color||"#444"}`,cursor:"pointer",background:isSel?`${colors.accent}22`:colors.card,transition:"all .15s"}}
              onClick={()=>selectMode?toggleSelect(p.id):push("detalle",{prodId:p.id})}>
              {selectMode&&<div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${isSel?"#3b82f6":"#2a3550"}`,background:isSel?"#3b82f6":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#fff",fontWeight:700}}>{isSel?"✓":""}</div>}
              <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:colors.text}}>{p.nombre}</div><div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6,color:colors.textMuted}}>{fmtCantRef(p)}</span>}</div></div>
              <div style={{textAlign:"right",flexShrink:0}}>{p.precioRef?<><div className="mono" style={{fontWeight:700,fontSize:16,color:colors.text}}>{fmt(p.precioRef)}</div>{gastoMensual(p)&&p.unidadesMes&&<div className="mono" style={{fontSize:11,color:pcat?.color,marginTop:2}}>{fmtU(p.unidadesMes)} u/mes = {fmt(gastoMensual(p))}</div>}</>:<div style={{fontSize:12,color:colors.textMuted}}>Sin precio</div>}</div>
            </div>);
          })}
        </div>}
    </div>);
  }


  // ── StockCard ─────────────────────────────────────────────────────────────────
  function StockCard({p,cat,stock,stockTotal,mesesRestantes,fmtMeses,guardarStock,askConfirm,onOpen,onClose,colors}) {
    const [open,setOpen]=useState(false);
    const [showAddDim,setShowAddDim]=useState(false);
    const [newCantRef,setNewCantRef]=useState("");
    const [newMetros,setNewMetros]=useState("");

    const entradasGuardadas=stock[p.id]||[];
    const entradas=entradasGuardadas.length===0&&p.cantidadRef
      ?[{cantRef:p.cantidadRef,unidad:p.unidad||"gr",stock:0,virtual:true,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null}]
      :entradasGuardadas;

    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";

    const handleOpen=()=>{const abriendo=!open;setOpen(abriendo);setShowAddDim(false);if(abriendo&&onOpen)onOpen();if(!abriendo&&onClose)onClose();};

    const fmtEntrada=(e)=>{
      if(e.rollosRef&&e.metrosRef) return `${e.rollosRef}x${e.metrosRef}${e.unidad||p.unidad||""}`;
      if(e.cantRef===p.cantidadRef) return fmtCantRef(p);
      return `${e.cantRef}${e.unidad||p.unidad||"gr"}`;
    };

    const cambiarStock=(idx,delta)=>{
      const base=entradasGuardadas.length===0&&p.cantidadRef
        ?[{cantRef:p.cantidadRef,unidad:p.unidad||"gr",stock:0,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null}]
        :entradasGuardadas;
      const nuevas=base.map((e,i)=>i===idx?{...e,stock:Math.max(0,e.stock+delta)}:e);
      guardarStock(p.id,nuevas);
    };

    const eliminarEntrada=(idx)=>{
      const nuevas=entradasGuardadas.filter((_,i)=>i!==idx);
      guardarStock(p.id,nuevas);
    };

    const agregarDimension=()=>{
      let cant, display=null;
      if(p.unidad==="m"){
        const r=parseFloat(newCantRef)||0;
        const m=parseFloat(newMetros)||0;
        cant=r*m;
        if(r>0&&m>0) display=`${r}x${m}`;
      } else {
        cant=parseFloat(newCantRef.replace(",","."));
      }
      if(!cant||cant<=0)return;
      if(entradasGuardadas.find(e=>e.cantRef===cant))return;
      const base=entradasGuardadas.length===0&&p.cantidadRef
        ?[{cantRef:p.cantidadRef,unidad:p.unidad||"gr",stock:0,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null}]
        :entradasGuardadas;
      const nuevas=[...base,{cantRef:cant,unidad:p.unidad||"gr",stock:0,display}];
      guardarStock(p.id,nuevas);
      setNewCantRef("");setNewMetros("");setShowAddDim(false);
    };

    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};

    return (
      <div className="card" style={{borderLeft:`3px solid ${cat?.color||"#444"}`,overflow:"hidden"}}>
        <div style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={handleOpen}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:colors.text}}>{p.nombre}</div>
            <div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6,color:colors.textMuted}}>{fmtCantRef(p)}</span>}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:12,color:colors.textMuted}}>Stock: <span className="mono" style={{fontWeight:700,fontSize:16,color:colors.text}}>{fmtTotal(total)}</span></div>
            <div style={{fontSize:12,fontWeight:600,color:urgColor,marginTop:2}}>{mesesTxt}</div>
          </div>
          <div style={{color:colors.hoverCard,fontSize:14,marginLeft:4}}>{open?"▲":"▼"}</div>
        </div>

        {open&&(
          <div style={{borderTop:`1px solid ${colors.cardBorder}`,padding:"12px 16px",display:"flex",flexDirection:"column",gap:10}}>
            {entradas.map((e,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,fontSize:14,fontWeight:600,color:colors.text}}>{fmtEntrada(e)}</div>
                <button onClick={()=>cambiarStock(i,-1)} disabled={e.stock<=0} style={{width:34,height:34,borderRadius:8,background:e.stock<=0?"#0d1321":"#1a2235",border:`1px solid ${colors.hoverCard}`,color:e.stock<=0?"#2a3570":"#e8eaf0",fontSize:20,cursor:e.stock<=0?"default":"pointer",fontFamily:"inherit",fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <div style={{width:32,textAlign:"center",fontFamily:"'DM Mono',monospace",fontWeight:700,fontSize:16,color:colors.text}}>{e.stock}</div>
                <button onClick={()=>cambiarStock(i,1)} style={{width:34,height:34,borderRadius:8,background:colors.btnSecondary,border:`1px solid ${colors.hoverCard}`,color:colors.text,fontSize:20,cursor:"pointer",fontFamily:"inherit",fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                {!e.virtual&&entradasGuardadas.length>1&&<button onClick={()=>askConfirm("¿Eliminar esta medida?",()=>eliminarEntrada(i),"Eliminar","#ef4444")} style={{width:28,height:28,borderRadius:6,background:"#1a0a0a",border:"1px solid #2d1212",color:colors.error,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>}
              </div>
            ))}

            {entradasGuardadas.length>1&&p.cantidadRef&&(
              <div style={{fontSize:12,color:colors.textMuted,borderTop:`1px solid ${colors.cardBorder}`,paddingTop:8}}>
                Total: <span style={{color:colors.text,fontWeight:600,fontFamily:"'DM Mono',monospace"}}>{fmtTotal(total)}</span> × {fmtCantRef(p)}
              </div>
            )}

            {!showAddDim&&(
              <button className="btn" onClick={()=>setShowAddDim(true)} style={{background:colors.card,border:"1px dashed #2a3550",color:colors.textMuted,padding:"7px 0",fontSize:13}}>
                + Agregar otra medida
              </button>
            )}
            {showAddDim&&(p.unidad==="m"?(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="3" value={newCantRef} onChange={e=>setNewCantRef(e.target.value)} style={{width:52,padding:"8px 8px",fontSize:14,textAlign:"center"}} autoFocus/>
                  <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>rollos ×</span>
                  <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="40" value={newMetros} onChange={e=>setNewMetros(e.target.value)} style={{width:52,padding:"8px 8px",fontSize:14,textAlign:"center"}}/>
                  <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>m</span>
                  <button className="btn" onClick={agregarDimension} style={{background:colors.accent,color:"#fff",padding:"8px 12px",fontSize:14}}>+</button>
                  <button className="btn" onClick={()=>{setShowAddDim(false);setNewCantRef("");setNewMetros("");}} style={{background:colors.btnSecondary,color:colors.textSecondary,padding:"8px 10px",fontSize:14}}>✕</button>
                </div>
                {parseFloat(newCantRef)>0&&parseFloat(newMetros)>0&&<div style={{fontSize:11,color:colors.textMuted}}>= <span style={{color:colors.accent,fontWeight:600}}>{parseFloat(newCantRef)*parseFloat(newMetros)} m</span> en total</div>}
              </div>
            ):(
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 1500" value={newCantRef} onChange={e=>setNewCantRef(e.target.value)}
                  style={{flex:1,padding:"8px 12px",fontSize:14}} autoFocus
                  onKeyDown={e=>e.key==="Enter"&&agregarDimension()}/>
                <span style={{fontSize:13,color:colors.textMuted,whiteSpace:"nowrap"}}>{p.unidad||"gr"}</span>
                <button className="btn" onClick={agregarDimension} style={{background:colors.accent,color:"#fff",padding:"8px 14px",fontSize:14}}>+</button>
                <button className="btn" onClick={()=>{setShowAddDim(false);setNewCantRef("");}} style={{background:colors.btnSecondary,color:colors.textSecondary,padding:"8px 10px",fontSize:14}}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── ComprasCard ───────────────────────────────────────────────────────────────
  function ComprasCard({p,cat,stock,stockTotal,mesesRestantes,fmtMeses,push,colors}) {
    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";
    const hist=p.historialCompra||[];
    const ultimoPrecio=hist.length>0?hist[hist.length-1].precio:null;
    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};
    return (
      <div className="card" style={{padding:"13px 16px",borderLeft:`3px solid ${cat?.color||"#444"}`}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:colors.text}}>{p.nombre}</div>
            <div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6}}>{fmtCantRef(p)}</span>}</div>
            <div style={{marginTop:6,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:12,fontWeight:600,color:urgColor}}>{mesesTxt}</span>
              <span style={{fontSize:11,color:colors.textMuted}}>· Stock: <span style={{color:colors.text,fontWeight:600,fontFamily:"'DM Mono',monospace"}}>{fmtTotal(total)}</span></span>
            </div>
            <div style={{marginTop:4,display:"flex",gap:10,alignItems:"center"}}>
              {p.precioRef&&<span style={{fontSize:12,color:colors.textMuted}}>Ref: <span style={{color:cat?.color||"#3b82f6",fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(p.precioRef)}</span></span>}
              {ultimoPrecio&&<span style={{fontSize:12,color:colors.textMuted}}>Último: <span style={{color:colors.text,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(ultimoPrecio)}</span></span>}
            </div>
          </div>
          <button onClick={()=>push("nuevo-precio",{prodId:p.id})} style={{width:36,height:36,borderRadius:10,background:colors.accent,border:"none",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:600,lineHeight:1,flexShrink:0}}>+</button>
        </div>
      </div>
    );
  }

  // ── PriceChart (SVG puro) ──────────────────────────────────────────────────
  function PriceChart({hist, precioRef, clr, colors}) {
    const W=320, H=150, PL=52, PR=20, PT=14, PB=28;
    const iW=W-PL-PR, iH=H-PT-PB;
    if (!hist||hist.length<1) return null;
    const prices=hist.map(h=>h.precio);
    const allVals=precioRef?[...prices,precioRef]:prices;
    const minV=Math.min(...allVals)*0.93;
    const maxV=Math.max(...allVals)*1.07;
    const range=maxV-minV||1;
    const toX=(i)=>PL+(hist.length===1?iW/2:(i/(hist.length-1))*iW);
    const toY=(v)=>PT+(1-(v-minV)/range)*iH;
    const refY=precioRef!=null?toY(precioRef):null;
    const pts=hist.map((h,i)=>`${toX(i).toFixed(1)},${toY(h.precio).toFixed(1)}`).join(" ");
    const yTicks=[minV,(minV+maxV)/2,maxV];
    const successColor=colors.success;
    const errorColor=colors.error;
    return (
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible",display:"block"}}>
        {yTicks.map((v,i)=>[
          <line key={"g"+i} x1={PL} y1={toY(v)} x2={W-PR} y2={toY(v)} stroke={colors.cardBorder} strokeWidth={1}/>,
          <text key={"t"+i} x={PL-4} y={toY(v)+4} textAnchor="end" fontSize={9} fill={colors.textMuted}>${Math.round(v)}</text>
        ])}
        {refY!=null&&(
          <line x1={PL} y1={refY} x2={W-PR} y2={refY} stroke={clr} strokeWidth={1.5} strokeDasharray="6 4" opacity={0.7}/>
        )}
        {refY!=null&&(
          <text x={W-PR+2} y={refY+4} fontSize={9} fill={clr} opacity={0.8}>ref</text>
        )}
        {hist.length>1&&<polyline points={pts} fill="none" stroke={successColor} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>}
        {hist.map((h,i)=>{
          const x=toX(i), y=toY(h.precio);
          const dotColor=refY!=null?(h.precio>precioRef?errorColor:successColor):successColor;
          const lblY=y>PT+20?y-8:y+16;
          const show=hist.length<=6||i===0||i===hist.length-1||i%Math.ceil(hist.length/5)===0;
          return (
            <g key={i}>
              <circle cx={x} cy={y} r={5} fill={dotColor} stroke={colors.inputBg} strokeWidth={1.5}/>
              {show&&<text x={x} y={lblY} textAnchor="middle" fontSize={9} fill={dotColor}>{fmt(h.precio)}</text>}
              <text x={x} y={H} textAnchor="middle" fontSize={8} fill={colors.textMuted}>{h.fecha?h.fecha.slice(5):""}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  // ── DetalleScreen ─────────────────────────────────────────────────────────────
  function DetalleScreen({prodId,productos,guardar,pop,showToast,askConfirm,push,gastoMensual,getCat,getSub,colors}) {
    const p=productos.find(x=>x.id===prodId); if(!p) return null;
    const cat=getCat(p.catId); const sub=p.subId?getSub(p.catId,p.subId):null;
    const gm=gastoMensual(p); const clr=cat?.color||"#3b82f6";
    const hist=p.historialCompra||[];
    const chartData=hist.map(h=>{
      let precioGrafico=h.equivalente||null;
      if(!precioGrafico&&h.cantidad&&p.cantidadRef){
        const cantNum=parseFloat(String(h.cantidad).replace(",","."));
        if(cantNum>0) precioGrafico=(h.precio/cantNum)*p.cantidadRef;
      }
      return {fecha:fmtDate(h.fecha),precio:precioGrafico||h.precio};
    });
    const variacion=hist.length>=2?((hist[hist.length-1].precio-hist[0].precio)/hist[0].precio*100).toFixed(1):null;
    const del=()=>askConfirm(`¿Eliminar "${p.nombre}"?`,async()=>{await guardar(null,productos.filter(x=>x.id!==prodId),{deleteRemoved:true});showToast("🗑️ Eliminado");pop();},"Eliminar","#ef4444");
    const delH=(hid)=>askConfirm("¿Eliminar este registro?",async()=>{await guardar(null,productos.map(x=>x.id===prodId?{...x,historialCompra:x.historialCompra.filter(h=>h.id!==hid)}:x));showToast("Eliminado");},"Eliminar","#ef4444");
    return (<div className="fade">
      <TopBar colors={colors} title={p.nombre} subtitle={[cat?.label,sub?.label].filter(Boolean).join(" › ")} onBack={pop}
        right={<div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>push("editar-prod",{prodId})} style={{background:colors.btnSecondary,color:colors.accent,border:`1px solid ${colors.hoverCard}`,padding:"8px 12px",fontSize:13}}>Editar</button>
          <button className="btn" onClick={del} style={{background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"8px 12px",fontSize:13}}>Eliminar</button>
        </div>}/>
      <div className="card" style={{padding:20,marginBottom:12,borderLeft:`4px solid ${clr}`}}>
        <div style={{display:"flex",gap:14}}>
          <div style={{fontSize:34}}>{cat?.emoji}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:19,color:colors.text}}>{p.nombre}</div><div style={{fontSize:13,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}</div><div style={{marginTop:8}}><span style={{background:clr+"22",color:clr,borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600}}>{cat?.label}{sub?` › ${sub.label}`:""}</span></div></div>
          {p.cantidadRef&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:18,fontWeight:700,color:colors.text}}>{fmtCantRef(p)}</div></div>}
        </div>
        <div style={{marginTop:16,background:colors.inputBg,borderRadius:12,padding:"14px 16px"}}>
          <div style={{fontSize:11,color:colors.textMuted,marginBottom:8,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>Precio de referencia</div>
          <div className="mono" style={{fontSize:28,fontWeight:700,color:clr}}>{p.precioRef?fmt(p.precioRef):"—"}</div>
          {p.precioRef&&p.unidadesMes&&(<div style={{display:"flex",alignItems:"center",gap:6,marginTop:10,padding:"9px 12px",background:colors.card,borderRadius:8}}>
            <span className="mono" style={{fontSize:14,color:colors.textSecondary,fontWeight:500}}>{fmtU(p.unidadesMes)}</span>
            <span style={{fontSize:13,color:colors.textMuted}}>u/mes</span>
            <span style={{fontSize:14,color:colors.textMuted,fontWeight:700}}>=</span>
            <span className="mono" style={{fontSize:15,fontWeight:700,color:clr}}>{fmt(gm)}</span>
          </div>)}
        </div>
        {variacion!==null&&<div style={{marginTop:10,fontSize:12,color:parseFloat(variacion)>0?"#ef4444":"#10b981"}}>{parseFloat(variacion)>0?"▲":"▼"} {Math.abs(variacion)}% desde el primer registro</div>}
      </div>
      <button className="btn" onClick={()=>push("nuevo-precio",{prodId})} style={{width:"100%",background:clr,color:"#080c14",padding:13,fontSize:14,marginBottom:14}}>+ Registrar precio de compra</button>
      {hist.length>=1&&(
      <div className="card" style={{padding:"18px 12px 10px",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:8,paddingLeft:4,color:colors.text}}>Evolución del precio de compra</div>
        <PriceChart hist={chartData} precioRef={p.precioRef} clr={clr} colors={colors}/>
      </div>
    )}
      {hist.length>0&&(<div className="card" style={{padding:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:12,color:colors.text}}>Historial de precios de compra</div>
        {[...hist].reverse().map((h,i)=>(<div key={h.id} style={{padding:"10px 0",borderBottom:i<hist.length-1?"1px solid #1a2235":"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"baseline",gap:8}}><div className="mono" style={{fontWeight:700,fontSize:16,color:colors.text}}>{fmt(h.precio)}</div>{h.cantidad&&p.unidad&&<div style={{fontSize:12,color:colors.textMuted}}>{h.cantidad}{p.unidad}</div>}</div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3,flexWrap:"wrap"}}>
                <div style={{fontSize:11,color:colors.textMuted}}>{fmtDate(h.fecha)}</div>
                {h.equivalente!=null&&p.cantidadRef&&(<div style={{fontSize:11,color:clr}}>≈ {fmt(h.equivalente)} por {fmtCantRef(p)}</div>)}
              </div>
            </div>
            <button className="btn" onClick={()=>delH(h.id)} style={{background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"5px 10px",fontSize:12}}>✕</button>
          </div>
        </div>))}
      </div>)}
    </div>);
  }

  // ── CantidadRefField ──────────────────────────────────────────────────────────
  function CantidadRefField({unidad, cantidadRef, rollosRef, metrosRef, onChange, colors}) {
    const initRollos = rollosRef ? String(rollosRef) : "";
    const initMetros = metrosRef ? String(metrosRef) : "";
    const [rollos, setRollos] = useState(initRollos);
    const [metros, setMetros] = useState(initMetros);

    const handleRollos=(v)=>{
      setRollos(v);
      const r=parseFloat(v)||0, m=parseFloat(metros)||0, total=r*m;
      onChange({valor:total>0?total:null, rollosRef:r>0?r:null, metrosRef:m>0?m:null});
    };
    const handleMetros=(v)=>{
      setMetros(v);
      const r=parseFloat(rollos)||0, m=parseFloat(v)||0, total=r*m;
      onChange({valor:total>0?total:null, rollosRef:r>0?r:null, metrosRef:m>0?m:null});
    };

    if(unidad==="m"){
      const r=parseFloat(rollos)||0;
      const m=parseFloat(metros)||0;
      const total=r*m;
      return (
        <div>
          <label style={{display:"block",fontSize:12,color:colors.textSecondary,marginBottom:6,fontWeight:600}}>Cantidad ref.</label>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="3" value={rollos} onChange={e=>handleRollos(e.target.value)} style={{width:52,padding:"9px 8px",textAlign:"center"}}/>
            <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>×</span>
            <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="40" value={metros} onChange={e=>handleMetros(e.target.value)} style={{width:52,padding:"9px 8px",textAlign:"center"}}/>
            <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>m</span>
          </div>
          {total>0&&<div style={{fontSize:11,color:colors.textMuted,marginTop:4}}>= <span style={{color:colors.accent,fontWeight:600}}>{total} m</span> en total</div>}
        </div>
      );
    }
    return (
      <div className="field">
        <label>Cantidad ref.</label>
        <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 300" value={cantidadRef!=null?String(cantidadRef):""} onChange={e=>onChange({valor:e.target.value,display:null})}/>
      </div>
    );
  }

  // ── EditarProdScreen ──────────────────────────────────────────────────────────
  function EditarProdScreen({prodId,cats,productos,guardar,pop,showToast,askConfirm,colors}) {
    const p=productos.find(x=>x.id===prodId); if(!p) return null;
    const [form,setForm]=useState({nombre:p.nombre,marca:p.marca||"",catId:p.catId,subId:p.subId||"",unidadesMes:p.unidadesMes!=null?String(p.unidadesMes):"",precioRef:p.precioRef!=null?String(p.precioRef):"",cantidadRef:p.cantidadRef,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null,unidad:p.unidad||"gr"});
    const [showAddSub,setShowAddSub]=useState(false);
    const selCat=cats.find(c=>c.id===form.catId);
    const createSub=async(label)=>{const ns={id:uid(),label:label.trim()};await guardar(cats.map(c=>c.id===form.catId?{...c,subs:[...c.subs,ns]}:c),null);setForm(f=>({...f,subId:ns.id}));setShowAddSub(false);showToast("✅ Subcategoría creada");};
    const submit=()=>askConfirm("¿Guardar los cambios?",async()=>{
      if(!form.nombre.trim())return showToast("El nombre es obligatorio","err");
      const pr=form.precioRef?parseFloat(String(form.precioRef).replace(",",".")):null;
      const um=form.unidadesMes?parseFrac(form.unidadesMes):null;
      const cr=form.cantidadRef!=null?parseFloat(form.cantidadRef):null;
      await guardar(null,productos.map(x=>x.id===prodId?{...x,...form,precioRef:pr,unidadesMes:um,cantidadRef:cr,rollosRef:form.rollosRef||null,metrosRef:form.metrosRef||null,subId:form.subId||null}:x));
      showToast("✅ Guardado");pop();
    },"Guardar cambios");
    return (<div className="fade"><TopBar colors={colors} title="Editar producto" subtitle={p.nombre} onBack={pop}/>
      <div className="card" style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
        <div className="field"><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}/></div>
        <div className="field"><label>Marca / detalle</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={form.marca} onChange={e=>setForm(f=>({...f,marca:e.target.value}))}/></div>
        <div className="field"><label>Categoría</label><select className="inp" value={form.catId} onChange={e=>setForm(f=>({...f,catId:e.target.value,subId:""}))}>
