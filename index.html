        <div className="field"><label>Subcategoría</label>
          <div style={{display:"flex",gap:8}}>
            <select className="inp" value={form.subId} onChange={e=>setForm(f=>({...f,subId:e.target.value}))} style={{flex:1}}>
              <option value="">— Sin subcategoría —</option>{[...(selCat?.subs||[])].sort((a,b)=>alpha(a,b)).map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            <button className="btn" onClick={()=>setShowAddSub(true)} style={{background:selCat?.color||"#3b82f6",color:"#fff",padding:"9px 14px",fontSize:18,flexShrink:0}}>+</button>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field"><label>Unidades/mes</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 2 o 1/3" value={form.unidadesMes} onChange={e=>setForm(f=>({...f,unidadesMes:e.target.value}))}/></div>
          <div className="field"><label>Precio ref. ($)</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 1200" value={form.precioRef} onChange={e=>setForm(f=>({...f,precioRef:e.target.value}))}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <CantidadRefField unidad={form.unidad} cantidadRef={form.cantidadRef} rollosRef={form.rollosRef} metrosRef={form.metrosRef} onChange={({valor,rollosRef,metrosRef})=>setForm(f=>({...f,cantidadRef:valor,rollosRef:rollosRef||null,metrosRef:metrosRef||null}))} colors={colors}/>
          <div className="field"><label>Unidad</label><select className="inp" value={form.unidad} onChange={e=>setForm(f=>({...f,unidad:e.target.value,cantidadRef:null,rollosRef:null,metrosRef:null}))}>
            <option value="gr">gr</option><option value="kg">kg</option><option value="mL">mL</option><option value="L">L</option><option value="m">m</option><option value="un">un</option></select></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button className="btn" onClick={pop} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button>
          <button className="btn" onClick={submit} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}}>Guardar cambios</button>
        </div>
      </div>
      {showAddSub&&<AddModal colors={colors} title={`Nueva subcategoría en ${selCat?.label}`} namePlaceholder="ej. Personal" onClose={()=>setShowAddSub(false)} onSave={({label})=>createSub(label)} showColor={false} accentColor={selCat?.color||"#3b82f6"}/>}
    </div>);
  }

  // ── NuevoProdScreen ───────────────────────────────────────────────────────────
  function NuevoProdScreen({cats,initCatId,initSubId,productos,guardar,pop,showToast,desdeCompras,agregarAlTicket,colors}) {
    const [form,setForm]=useState({
      nombre:"",marca:"",
      catId:initCatId||"", // sin default
      subId:initSubId&&initSubId!==UNASSIGNED_ID?initSubId:"",
      unidadesMes:"1",precioRef:"",cantidadRef:null,rollosRef:null,metrosRef:null,unidad:"gr"
    });
    const [showAddCat,setShowAddCat]=useState(false);
    const [showAddSub,setShowAddSub]=useState(false);

    const selCat=cats.find(c=>c.id===form.catId);

    const createCat=async({label,emoji,color})=>{
      const nc={id:uid(),label,emoji,color,subs:[]};
      await guardar([...cats,nc],null);
      setForm(f=>({...f,catId:nc.id,subId:""}));
      setShowAddCat(false);
      showToast("✅ Categoría creada");
    };

    const createSub=async(label)=>{
      const ns={id:uid(),label:label.trim()};
      await guardar(cats.map(c=>c.id===form.catId?{...c,subs:[...c.subs,ns]}:c),null);
      setForm(f=>({...f,subId:ns.id}));
      setShowAddSub(false);
      showToast("✅ Subcategoría creada");
    };

    const submit=async()=>{
      if(!form.nombre.trim()||!form.marca.trim()) return showToast("Nombre y marca son obligatorios","err");
      if(!form.catId) return showToast("Elegí una categoría","err");
      const pr=form.precioRef?parseFloat(String(form.precioRef).replace(",",".")):null;
      const um=form.unidadesMes?parseFrac(form.unidadesMes):null;
      const cr=form.cantidadRef!=null?parseFloat(form.cantidadRef):null;
      const nuevoProd={...form,precioRef:pr,unidadesMes:um,cantidadRef:cr,rollosRef:form.rollosRef||null,metrosRef:form.metrosRef||null,id:uid(),historialCompra:[],subId:form.subId||null};
      await guardar(null,[...productos,nuevoProd]);
      if(desdeCompras&&agregarAlTicket&&pr){
        agregarAlTicket({
          prodId:nuevoProd.id,nombre:nuevoProd.nombre,marca:nuevoProd.marca,cantRef:cr,rollosRef:nuevoProd.rollosRef,metrosRef:nuevoProd.metrosRef,
          unidad:nuevoProd.unidad,precio:pr,equivalente:pr,precioRef:pr,fecha:todayISO(),
          cantComprada:1,totalPagado:pr,totalRef:pr
        });
      }
      showToast("✅ Producto creado");pop();
    };

    return (<div className="fade">
      <div style={{height:20}}/>
      <div className="card" style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
        <div style={{fontWeight:700,fontSize:18,color:colors.text,marginBottom:2}}>Nuevo producto</div>
        <div className="field"><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. Leche entera" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}/></div>
        <div className="field"><label>Marca / detalle</label><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. La Serenísima" value={form.marca} onChange={e=>setForm(f=>({...f,marca:e.target.value}))}/></div>

        {/* Categoría con botón + */}
        <div className="field"><label>Categoría</label>
          <div style={{display:"flex",gap:8}}>
            <select className="inp" value={form.catId} onChange={e=>setForm(f=>({...f,catId:e.target.value,subId:""}))} style={{flex:1}}>
              <option value="">— Elegir categoría —</option>
              {[...cats].sort((a,b)=>alpha(a,b)).map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
            </select>
            <button className="btn" onClick={()=>setShowAddCat(true)} style={{background:colors.accent,color:"#fff",padding:"9px 14px",fontSize:18,flexShrink:0}}>+</button>
          </div>
        </div>

        {/* Subcategoría con botón + */}
        <div className="field"><label>Subcategoría</label>
          <div style={{display:"flex",gap:8}}>
            <select className="inp" value={form.subId} onChange={e=>setForm(f=>({...f,subId:e.target.value}))} disabled={!form.catId} style={{flex:1,opacity:form.catId?1:0.4}}>
              <option value="">— Sin subcategoría —</option>
              {[...(selCat?.subs||[])].sort((a,b)=>alpha(a,b)).map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            <button className="btn" onClick={()=>form.catId&&setShowAddSub(true)} style={{background:form.catId?(selCat?.color||"#3b82f6"):"#1a2235",color:form.catId?"#fff":"#4a5568",padding:"9px 14px",fontSize:18,flexShrink:0,cursor:form.catId?"pointer":"default"}}>+</button>
          </div>
        </div>

        {/* Modal agregar subcategoría */}
        {showAddSub&&<AddModal colors={colors} title={`Nueva subcategoría en ${selCat?.label}`} namePlaceholder="ej. Personal" onClose={()=>setShowAddSub(false)} onSave={({label})=>createSub(label)} showColor={false} accentColor={selCat?.color||"#3b82f6"}/>}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field"><label>Unidades/mes</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 2 o 1/3" value={form.unidadesMes} onChange={e=>setForm(f=>({...f,unidadesMes:e.target.value}))}/></div>
          <div className="field"><label>Precio ref. ($)</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="Opcional" value={form.precioRef} onChange={e=>setForm(f=>({...f,precioRef:e.target.value}))}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <CantidadRefField unidad={form.unidad} cantidadRef={form.cantidadRef} rollosRef={form.rollosRef} metrosRef={form.metrosRef} onChange={({valor,rollosRef,metrosRef})=>setForm(f=>({...f,cantidadRef:valor,rollosRef:rollosRef||null,metrosRef:metrosRef||null}))} colors={colors}/>
          <div className="field"><label>Unidad</label><select className="inp" value={form.unidad} onChange={e=>setForm(f=>({...f,unidad:e.target.value,cantidadRef:null,rollosRef:null,metrosRef:null}))}>
            <option value="gr">gr</option><option value="kg">kg</option><option value="mL">mL</option><option value="L">L</option><option value="m">m</option><option value="un">un</option></select></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button className="btn" onClick={pop} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button>
          <button className="btn" onClick={submit} style={{flex:2,background:form.catId?"#3b82f6":"#1a2235",color:form.catId?"#fff":"#4a5568",padding:13,fontSize:15,cursor:form.catId?"pointer":"default"}}>Guardar</button>
        </div>
      </div>
      {showAddCat&&<AddModal colors={colors} title="Nueva categoría" namePlaceholder="ej. Panadería" onClose={()=>setShowAddCat(false)} onSave={createCat} showColor={true}/>}
    </div>);
  }

  // ── NuevoPrecioScreen ─────────────────────────────────────────────────────────
  function NuevoPrecioScreen({prodId,productos,guardar,pop,showToast,getCat,colors}) {
    const p=productos.find(x=>x.id===prodId); if(!p) return null;
    const cat=getCat(p.catId); const clr=cat?.color||"#3b82f6";
    const cantRef=p.cantidadRef||null; const unidad=p.unidad||"gr";
    const [form,setForm]=useState({precio:"",cantidad:"",fecha:todayISO()});
    const [saving,setSaving]=useState(false);
    useEffect(()=>{if(cantRef)setForm(f=>({...f,cantidad:String(cantRef)}));},[]);
    const precio=parseFloat((form.precio||"").replace(",","."));
    const cantidadNum=unidad==="m"||unidad==="un"?parseQty(form.cantidad):parseFloat((form.cantidad||"").replace(",","."));
    const cantRefNum=unidad==="m"||unidad==="un"?parseQty(String(cantRef||"")):cantRef;
    const equivalente=(precio>0&&cantidadNum>0&&cantRefNum)?(precio/cantidadNum)*cantRefNum:null;
    const diff=(equivalente!=null&&p.precioRef)?((equivalente-p.precioRef)/p.precioRef*100):null;
    const submit=async()=>{
      if(!precio||precio<=0)return showToast("Precio inválido","err");
      setSaving(true);
      try {
        const entrada={id:uid(),precio,cantidad:form.cantidad||null,equivalente,fecha:form.fecha};
        await guardar(null,productos.map(x=>x.id===prodId?{...x,historialCompra:[...(x.historialCompra||[]),entrada].sort((a,b)=>a.fecha.localeCompare(b.fecha))}:x));
        showToast("✅ Precio registrado");
        pop();
      } catch(e) {
        showToast("Error al guardar","err");
      } finally {
        setSaving(false);
      }
    };
    return (<div className="fade"><TopBar colors={colors} title="Precio de compra" subtitle={`${p.nombre} · ${p.marca||""}`} onBack={pop}/>
      <div className="card" style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:clr+"15",borderRadius:10,padding:"10px 14px",fontSize:13,color:colors.textSecondary}}>Precio de referencia: <span style={{color:clr,fontWeight:700}}>{p.precioRef?fmt(p.precioRef):"no definido"}</span>{cantRef&&<span style={{marginLeft:8,color:colors.textMuted}}>· {cantRef}{unidad}</span>}</div>
        <div className="field"><label>Precio que pagué ($)</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 1200" value={form.precio} onChange={e=>setForm(f=>({...f,precio:e.target.value}))} autoFocus/></div>
        <div className="field"><label>Cantidad comprada ({unidad})</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder={cantRef?String(cantRef):unidad==="m"?"ej. 6x50":unidad==="un"?"ej. 50":"ej. 100"} value={form.cantidad} onChange={e=>setForm(f=>({...f,cantidad:e.target.value}))}/></div>
        {equivalente!=null&&(<div style={{background:colors.inputBg,borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:colors.textMuted,marginBottom:6,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>Equivalente a {cantRef}{unidad}</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="mono" style={{fontSize:22,fontWeight:700,color:clr}}>{fmt(equivalente)}</div>
            {diff!=null&&(<div style={{fontSize:13,fontWeight:600,color:diff>0?"#ef4444":"#10b981",background:diff>0?"#ef444418":"#10b98118",padding:"3px 10px",borderRadius:6}}>{diff>0?"▲":"▼"} {Math.abs(diff).toFixed(1)}% {diff>0?"más caro":"más barato"}</div>)}
          </div>
        </div>)}
        <div className="field"><label>Fecha</label><input className="inp" type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/></div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button className="btn" onClick={pop} disabled={saving} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button>
          <button className="btn" onClick={submit} disabled={saving} style={{flex:2,background:saving?"#1a2235":clr,color:saving?"#4a5568":"#080c14",padding:13,fontSize:15,transition:"all .2s"}}>
            {saving?"Guardando…":"Confirmar"}
          </button>
        </div>
      </div>
    </div>);
  }

  // ── ExportScreen ──────────────────────────────────────────────────────────────
  // ── CuentaScreen ─────────────────────────────────────────────────────────────
  function CuentaScreen({session,pop,showToast,colors,cerrarSesion,askConfirm}) {
    const [editNombre,setEditNombre]=useState(false);
    const [nombre,setNombre]=useState(session.user.user_metadata?.nombre||"");
    const [savingNombre,setSavingNombre]=useState(false);
    const [showPassForm,setShowPassForm]=useState(false);
    const [passActual,setPassActual]=useState("");
    const [passNueva,setPassNueva]=useState("");
    const [passRepetir,setPassRepetir]=useState("");
    const [passError,setPassError]=useState("");
    const [savingPass,setSavingPass]=useState(false);

    const guardarNombre=async()=>{
      if(!nombre.trim())return;
      setSavingNombre(true);
      try{
        const {error:err}=await sb.auth.updateUser({data:{nombre:nombre.trim()}});
        if(err){showToast(err.message,"err");setSavingNombre(false);return;}
        showToast("Nombre actualizado");
        setEditNombre(false);
      }catch(e){showToast("Error al guardar","err");}
      setSavingNombre(false);
    };

    const cambiarPassword=async()=>{
      setPassError("");
      if(!passActual||!passNueva||!passRepetir){setPassError("Completá los 3 campos.");return;}
      if(passNueva.length<6){setPassError("La nueva contraseña tiene que tener al menos 6 caracteres.");return;}
      if(passNueva!==passRepetir){setPassError("Las contraseñas nuevas no coinciden.");return;}
      setSavingPass(true);
      try{
        const {error:errLogin}=await sb.auth.signInWithPassword({email:session.user.email,password:passActual});
        if(errLogin){setPassError("La contraseña actual es incorrecta.");setSavingPass(false);return;}
        const {error:errUpd}=await sb.auth.updateUser({password:passNueva});
        if(errUpd){setPassError(errUpd.message);setSavingPass(false);return;}
        showToast("Contraseña actualizada");
        setShowPassForm(false);setPassActual("");setPassNueva("");setPassRepetir("");
      }catch(e){setPassError("Error inesperado.");}
      setSavingPass(false);
    };

    return (<div className="fade">
      <TopBar colors={colors} title="👤 Cuenta" onBack={pop}/>
      <div className="card" style={{padding:16,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Email</div>
        <div style={{fontSize:14,color:colors.text,marginBottom:16}}>{session.user.email}</div>

        <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Nombre</div>
        {editNombre?(
          <div style={{display:"flex",gap:8}}>
            <input className="inp" autoComplete="canasta-field-ignore" value={nombre} onChange={e=>setNombre(e.target.value)} style={{flex:1}}/>
            <button className="btn" disabled={savingNombre} onClick={guardarNombre} style={{background:colors.accent,color:"#fff",padding:"0 16px",fontSize:13}}>OK</button>
          </div>
        ):(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:14,color:colors.text}}>{nombre||"—"}</div>
            <button className="btn" onClick={()=>setEditNombre(true)} style={{background:colors.btnSecondary,color:colors.accent,padding:"6px 12px",fontSize:12}}>Editar</button>
          </div>
        )}
      </div>

      <div className="card" style={{padding:16,marginBottom:12}}>
        {!showPassForm?(
          <button className="btn" onClick={()=>setShowPassForm(true)} style={{width:"100%",background:colors.btnSecondary,color:colors.accent,padding:11,fontSize:13}}>🔒 Cambiar contraseña</button>
        ):(
          <div>
            <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Cambiar contraseña</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div className="field"><label>Contraseña actual</label><PasswordInput colors={colors} value={passActual} onChange={e=>setPassActual(e.target.value)}/></div>
              <div className="field"><label>Nueva contraseña</label><PasswordInput colors={colors} value={passNueva} onChange={e=>setPassNueva(e.target.value)}/><div style={{fontSize:11,color:colors.textMuted,marginTop:2}}>Mínimo 6 caracteres</div></div>
              <div className="field"><label>Repetir nueva contraseña</label><PasswordInput colors={colors} value={passRepetir} onChange={e=>setPassRepetir(e.target.value)}/></div>
            </div>
            {passError&&<div style={{color:colors.error,fontSize:12.5,marginTop:10}}>{passError}</div>}
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button className="btn" onClick={()=>{setShowPassForm(false);setPassActual("");setPassNueva("");setPassRepetir("");setPassError("");}} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:11,fontSize:13}}>Cancelar</button>
              <button className="btn" disabled={savingPass} onClick={cambiarPassword} style={{flex:1,background:colors.accent,color:"#fff",padding:11,fontSize:13,opacity:savingPass?.6:1}}>{savingPass?"Un momento…":"Confirmar"}</button>
            </div>
          </div>
        )}
      </div>
      <button className="btn" onClick={()=>askConfirm("¿Cerrar sesión?",cerrarSesion,"Cerrar sesión","#ef4444")} style={{width:"100%",padding:12,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,fontSize:13}}>Cerrar sesión</button>
    </div>);
  }

  // ── GrupoFamiliarScreen ──────────────────────────────────────────────────────
  function GrupoFamiliarScreen({grupoInfo,grupoId,cargarInfoGrupo,session,pop,showToast,colors,salirDelGrupo,expulsarMiembro,regenerarCodigo,renombrarGrupo,askConfirm}) {
    const [editNombre,setEditNombre]=useState(false);
    const [nombre,setNombre]=useState(grupoInfo?.nombre||"");
    const [tardando,setTardando]=useState(false);
    const esAdmin=grupoInfo?.rol==="admin";
    const link=grupoInfo?.codigo_invitacion?`${window.location.origin}${window.location.pathname}#join/${grupoInfo.codigo_invitacion}`:"";

      <div className="card" style={{padding:16,marginBottom:12}}>

              <div style={{fontSize:11,color:colors.textMuted,textTransform:"capitalize"}}>{m.rol}</div>
            </div>

          <div style={{fontSize:12.5,color:colors.textMuted,marginBottom:10,lineHeight:1.4}}>Compartí este link con quien quieras sumar a tu grupo. Van a ver y compartir la misma base de datos.</div>

  function ExportScreen({cats,productos,pop,showToast,colors}) {

    const SectionRow=({label,catId,subId,indent=false})=>{
      const key=`${catId}-${subId}`;
      const isOpen=openKey===key;
      const text=buildExportText(cats,productos,catId,subId);
      return (<div style={{borderTop:`1px solid ${colors.cardBorder}`}}>
        <div className="row" style={{padding:`10px 16px 10px ${indent?44:16}px`,display:"flex",alignItems:"center",gap:10,cursor:"pointer",WebkitTapHighlightColor:"transparent"}} onClick={()=>toggle(key)}>
          <div style={{flex:1,fontSize:indent?13:14,color:indent?"#c8cfe0":"#e8eaf0",fontWeight:indent?400:600}}>{label}</div>

          <pre style={{fontSize:12,color:colors.text,lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"'DM Mono',monospace",background:colors.inputBg,padding:"32px 16px 12px",margin:0,borderTop:`1px solid ${colors.cardBorder}`}}>{text||"Sin productos."}</pre>
        </div>}

    return (<div className="fade"><TopBar colors={colors} title="📋 Exportar lista" subtitle="Tocá una sección para ver y copiar" onBack={pop}/>

      {[...cats].sort((a,b)=>alpha(a,b)).map(cat=>{
        const cp=productos.filter(p=>p.catId===cat.id);
        const validS=new Set(cat.subs.map(s=>s.id));
        const orphans=cp.filter(p=>!p.subId||!validS.has(p.subId));
        const hasSubs=cat.subs.length>0;
        return (<div key={cat.id} className="card" style={{marginBottom:8,overflow:"hidden",borderLeft:`3px solid ${cat.color}`}}>
          <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>

          </div>

          {hasSubs&&[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>{
            const sp=cp.filter(p=>p.subId===sub.id);
            if(!sp.length)return null;

  // ── ImportScreen ──────────────────────────────────────────────────────────────
  function ImportScreen({cats,productos,guardar,pop,showToast,colors}) {
    const [step,setStep]=useState("input"); const [text,setText]=useState(""); const [parsed,setParsed]=useState([]);
    const [conflicts,setConflicts]=useState([]); const [resolutions,setResolutions]=useState({});
    const [catsParaImport,setCatsParaImport]=useState(null);
    const doParse=async()=>{
    const blocks=parseImportText(text);
    if(!blocks.length)return showToast("No se encontraron productos válidos","err");
    // Auto-create missing cats and subs
    let updatedCats=[...cats];
    const matched=blocks.map(b=>{
      let cat=updatedCats.find(c=>matchStr(c.label,b.catLabel));
      if(!cat){
        // Create new category
        const CATCOLORS=["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
        cat={id:uid(),label:b.catLabel,emoji:"📦",color:CATCOLORS[updatedCats.length%CATCOLORS.length],subs:[]};
        updatedCats=[...updatedCats,cat];
      }
      let sub=null;
      if(b.subLabel){
        sub=cat.subs.find(s=>matchStr(s.label,b.subLabel));
        if(!sub){
          // Create new subcategory
          sub={id:uid(),label:b.subLabel};
          const newSubs=[...cat.subs,sub];
          updatedCats=updatedCats.map(c=>c.id===cat.id?{...c,subs:newSubs}:c);
          cat={...cat,subs:newSubs};
        }
      }
      return{...b,catId:cat.id,subId:sub?.id||null,catMatched:true,subMatched:true,autoCreated:!cats.find(c=>c.id===cat.id),autoCreatedSub:b.subLabel&&!cats.find(c=>c.id===cat.id||c.subs.find(s=>s.id===sub?.id))};
    });
    // Guardar cats actualizadas en el estado local para que doImport las use
    if(updatedCats.length>cats.length||updatedCats.some((c,i)=>c.subs.length!==(cats[i]?.subs.length||0))){
      setCatsParaImport(updatedCats);
    } else {
      setCatsParaImport(null);
    }
    setParsed(matched);setStep("preview");
  };
    const doImport=async()=>{
      const toAdd=[];const toUpdate=[];
      parsed.forEach(block=>{
        if(!block.catId)return;
        block.products.forEach(p=>{
          const ex=productos.find(x=>x.nombre.toLowerCase()===p.nombre.toLowerCase()&&x.catId===block.catId);
          if(ex){if(resolutions[ex.id]==="overwrite")toUpdate.push({...ex,...p,catId:block.catId,subId:block.subId||null});}
          else{toAdd.push({...p,id:uid(),catId:block.catId,subId:block.subId||null,historialCompra:[]});}
        });
      });
      const updatedProds=productos.map(p=>{const u=toUpdate.find(x=>x.id===p.id);return u||p;}).concat(toAdd);
      // Guardar cats y productos en una sola operación
      await guardar(catsParaImport||null, updatedProds);
      showToast(`✅ ${toAdd.length} agregados, ${toUpdate.length} actualizados`);
      pop();
    };
    const checkConflicts=()=>{const found=[];parsed.forEach(block=>{if(!block.catId)return;block.products.forEach(p=>{const ex=productos.find(x=>x.nombre.toLowerCase()===p.nombre.toLowerCase()&&x.catId===block.catId);if(ex)found.push({existing:ex,incoming:p,block});});});if(found.length){setConflicts(found);const def={};found.forEach(c=>{def[c.existing.id]="skip";});setResolutions(def);setStep("conflicts");}else doImport();};
    return (<div className="fade"><TopBar colors={colors} title="📥 Importar lista" onBack={pop}/>
      {step==="input"&&(<div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:13,color:colors.textSecondary,marginBottom:10,lineHeight:1.6}}>Formato por bloque (separá bloques con línea en blanco):<pre style={{marginTop:8,fontSize:12,color:"#4a90d9",background:colors.inputBg,borderRadius:8,padding:10,lineHeight:1.8}}>{`---Higiene---\nPersonal\nShampoo-Dove-400-mL-4500$-1\nJabón-Dove-90-gr-1180$-4\n\nLimpieza hogar\nDetergente-Magistral-500-mL-2371$-1\n\n---Primario---\nLeche-Carrefour-1-L-1182$-9`}</pre></div>
          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Pegá tu lista acá…" style={{width:"100%",minHeight:200,background:colors.inputBg,border:`1px solid ${colors.cardBorder}`,color:colors.text,borderRadius:10,padding:"11px 14px",fontSize:13,fontFamily:"'DM Mono',monospace",outline:"none",resize:"vertical",lineHeight:1.7}}/>
        </div>
        <div style={{display:"flex",gap:10}}><button className="btn" onClick={pop} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button><button className="btn" onClick={doParse} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}} disabled={!text.trim()}>Importar</button></div>
      </div>)}
      {step==="preview"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:colors.textMuted,marginBottom:4}}>Se van a importar {parsed.reduce((s,b)=>s+b.products.length,0)} productos:</div>
        {parsed.map((block,bi)=>{const cat=cats.find(c=>c.id===block.catId);return(<div key={bi} className="card" style={{padding:14,borderLeft:`3px solid ${cat?.color||"#4a5568"}`}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:2,color:colors.text}}>{cat?.emoji} {block.catLabel}{block.subLabel?` › ${block.subLabel}`:""}</div>
          {block.autoCreated&&<div style={{fontSize:12,color:"#4ade80",marginBottom:6}}>✅ Categoría nueva creada</div>}
          {block.autoCreatedSub&&<div style={{fontSize:12,color:"#4ade80",marginBottom:6}}>✅ Subcategoría nueva creada</div>}
          <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>{block.products.map((p,pi)=>(<div key={pi} style={{fontSize:13,color:p.error?"#ef4444":"#c8cfe0",display:"flex",justifyContent:"space-between"}}><span>{p.error?`⚠️ ${p.error}`:`${p.nombre} · `}<span style={{color:colors.textMuted}}>{p.marca}</span></span><span className="mono" style={{color:"#60a5fa"}}>{p.precioRef?fmt(p.precioRef):"—"}</span></div>))}</div>
        </div>);})}
        <div style={{display:"flex",gap:10,marginTop:4}}><button className="btn" onClick={()=>setStep("input")} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Volver</button><button className="btn" onClick={checkConflicts} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}}>Importar</button></div>
      </div>)}
      {step==="conflicts"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:colors.warning,marginBottom:4}}>⚠️ {conflicts.length} producto{conflicts.length!==1?"s":""} ya existe{conflicts.length===1?"":"n"}.</div>
        {conflicts.map((c,i)=>(<div key={i} className="card" style={{padding:14}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:8,color:colors.text}}>{c.existing.nombre}</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:10}}>Actual: {fmt(c.existing.precioRef)} · Nuevo: {fmt(c.incoming.precioRef)}</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn" onClick={()=>setResolutions(r=>({...r,[c.existing.id]:"skip"}))} style={{flex:1,padding:"9px 0",fontSize:13,background:resolutions[c.existing.id]==="skip"?"#1a2235":"#0d1321",color:resolutions[c.existing.id]==="skip"?"#e8eaf0":"#4a5568",border:`1px solid ${resolutions[c.existing.id]==="skip"?"#3b82f6":"#1a2235"}`}}>Mantener</button>
            <button className="btn" onClick={()=>setResolutions(r=>({...r,[c.existing.id]:"overwrite"}))} style={{flex:1,padding:"9px 0",fontSize:13,background:resolutions[c.existing.id]==="overwrite"?"#3b82f622":"#0d1321",color:resolutions[c.existing.id]==="overwrite"?"#3b82f6":"#4a5568",border:`1px solid ${resolutions[c.existing.id]==="overwrite"?"#3b82f6":"#1a2235"}`}}>Sobreescribir</button>
          </div>
        </div>))}
        <div style={{display:"flex",gap:10,marginTop:4}}><button className="btn" onClick={()=>setStep("preview")} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Volver</button><button className="btn" onClick={doImport} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}}>Confirmar</button></div>
      </div>)}
    </div>);
  }

  // ── ConfigScreen ──────────────────────────────────────────────────────────────
  function ConfigScreen({cats,productos,guardar,pop,showToast,askConfirm,openCatId,colors}) {
    const [openId,setOpenId]=useState(openCatId||null); const [localCats,setLocalCats]=useState(cats);
    const [newSubInputs,setNewSubInputs]=useState({}); const [movingSub,setMovingSub]=useState(null); const [moveTarget,setMoveTarget]=useState("");
    useEffect(()=>{setLocalCats(cats);},[cats]);
    const save=async(next)=>{setLocalCats(next);await guardar(next,null);};
    const deleteCat=(id)=>askConfirm("¿Eliminar esta categoría?",async()=>{if(productos.some(p=>p.catId===id))return showToast("Eliminá los productos primero","err");save(localCats.filter(c=>c.id!==id));showToast("Categoría eliminada");setOpenId(null);},"Eliminar","#ef4444");
    const addSub=(catId)=>askConfirm(`¿Crear subcategoría "${(newSubInputs[catId]||"").trim()}"?`,async()=>{const label=(newSubInputs[catId]||"").trim();if(!label)return;save(localCats.map(c=>c.id===catId?{...c,subs:[...c.subs,{id:uid(),label}]}:c));setNewSubInputs(f=>({...f,[catId]:""}));showToast("✅ Subcategoría creada");},"Crear");
    const deleteSub=(catId,subId)=>askConfirm("¿Eliminar esta subcategoría?",async()=>{if(productos.some(p=>p.catId===catId&&p.subId===subId))return showToast("Eliminá los productos primero","err");save(localCats.map(c=>c.id===catId?{...c,subs:c.subs.filter(s=>s.id!==subId)}:c));},"Eliminar","#ef4444");
    const doMoveSub=async()=>{if(!moveTarget||!movingSub)return;const sub=localCats.find(c=>c.id===movingSub.catId)?.subs?.find(s=>s.id===movingSub.subId);if(!sub)return;const nc=localCats.map(c=>{if(c.id===movingSub.catId)return{...c,subs:c.subs.filter(s=>s.id!==movingSub.subId)};if(c.id===moveTarget)return{...c,subs:[...c.subs,sub]};return c;});const np=productos.map(p=>p.catId===movingSub.catId&&p.subId===movingSub.subId?{...p,catId:moveTarget}:p);await guardar(nc,np);setMovingSub(null);setMoveTarget("");showToast("✅ Subcategoría movida");};
    return (<div className="fade"><TopBar colors={colors} title="📂 Configuración" subtitle="Categorías y subcategorías" onBack={pop}/>
      {movingSub&&(<div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:colors.card,border:`1px solid ${colors.hoverCard}`,borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontWeight:600,marginBottom:4,color:colors.text}}>Mover "{movingSub.label}"</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:14}}>Elegí la categoría destino:</div>
          <select className="inp" value={moveTarget} onChange={e=>setMoveTarget(e.target.value)} style={{marginBottom:16}}><option value="">— Elegir —</option>{localCats.filter(c=>c.id!==movingSub.catId).sort((a,b)=>alpha(a,b)).map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}</select>
          <div style={{display:"flex",gap:10}}><button className="btn" onClick={()=>{setMovingSub(null);setMoveTarget("");}} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:12}}>Cancelar</button><button className="btn" onClick={doMoveSub} style={{flex:1,background:colors.accent,color:"#fff",padding:12}} disabled={!moveTarget}>Mover</button></div>
        </div>
      </div>)}
      {[...localCats].sort((a,b)=>alpha(a,b)).map(cat=>(<div key={cat.id} className="card" style={{marginBottom:10,overflow:"hidden",borderTop:`3px solid ${cat.color}`}}>
        <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpenId(openId===cat.id?null:cat.id)}>
          <span style={{fontSize:20}}>{cat.emoji}</span><span style={{fontWeight:600,flex:1,color:colors.text}}>{cat.label}</span><span style={{fontSize:12,color:colors.textMuted}}>{cat.subs.length} sub</span><span style={{color:colors.textMuted,fontSize:13,marginLeft:4}}>{openId===cat.id?"▲":"▼"}</span>
        </div>
        {openId===cat.id&&(<div style={{padding:"0 16px 16px",borderTop:`1px solid ${colors.cardBorder}`}}>
          <CatEditFields cat={cat} onSave={(changes)=>askConfirm("¿Guardar cambios?",()=>save(localCats.map(c=>c.id===cat.id?{...c,...changes}:c)),"Guardar")} colors={colors}/>
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Subcategorías</div>
            {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>(<SubEditRow key={sub.id} sub={sub} catColor={cat.color}
              onSave={(label)=>askConfirm("¿Guardar cambios?",()=>save(localCats.map(c=>c.id===cat.id?{...c,subs:c.subs.map(s=>s.id===sub.id?{...s,label}:s)}:c)),"Guardar")}
              onDelete={()=>deleteSub(cat.id,sub.id)} onMove={()=>{setMovingSub({catId:cat.id,subId:sub.id,label:sub.label});setMoveTarget("");}} colors={colors}/>))}
            <div style={{display:"flex",gap:8,marginTop:6}}><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="+ Nueva subcategoría…" value={newSubInputs[cat.id]||""} onChange={e=>setNewSubInputs(f=>({...f,[cat.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addSub(cat.id)} style={{flex:1,borderStyle:"dashed",padding:"8px 12px",fontSize:13}}/><button className="btn" onClick={()=>addSub(cat.id)} style={{background:cat.color,color:"#080c14",padding:"7px 14px",fontSize:14}}>+</button></div>
          </div>
          <button className="btn" onClick={()=>deleteCat(cat.id)} style={{marginTop:14,width:"100%",background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:10,fontSize:13}}>Eliminar categoría</button>
        </div>)}
      </div>))}
    </div>);
  }

  function CatEditFields({cat,onSave,colors}) {
    const [emoji,setEmoji]=useState(cat.emoji); const [label,setLabel]=useState(cat.label); const [color,setColor]=useState(cat.color);
    return (<div style={{marginTop:12}}>
      <div style={{display:"grid",gridTemplateColumns:"64px 1fr",gap:8}}>
        <div className="field"><label>Emoji</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={emoji} onChange={e=>setEmoji(e.target.value)} style={{textAlign:"center",fontSize:18,padding:"8px 4px"}}/></div>
        <div className="field"><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={label} onChange={e=>setLabel(e.target.value)}/></div>
      </div>
      <div style={{marginTop:10}}><div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Color</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{COLORS.map(c=><div key={c} onClick={()=>setColor(c)} style={{width:26,height:26,borderRadius:"50%",background:c,cursor:"pointer",border:color===c?"3px solid #fff":"3px solid transparent",transition:"all .15s"}}/>)}</div></div>
      <button className="btn" onClick={()=>onSave({emoji,label,color})} style={{marginTop:10,width:"100%",background:colors.btnSecondary,color:colors.accent,padding:10,fontSize:13}}>Guardar cambios categoría</button>
    </div>);
  }

  function SubEditRow({sub,catColor,onSave,onDelete,onMove,colors}) {
    const [label,setLabel]=useState(sub.label);
    return (<div style={{background:colors.inputBg,borderRadius:8,padding:"8px 10px",marginBottom:6}}>
      <input type="search" autoComplete="canasta-field-ignore" className="inp" value={label} onChange={e=>setLabel(e.target.value)} style={{marginBottom:6,padding:"7px 10px",fontSize:13}}/>
      <div style={{display:"flex",gap:6}}>
        <button className="btn" onClick={()=>onSave(label)} style={{flex:1,background:colors.btnSecondary,color:colors.accent,padding:"6px 0",fontSize:12}}>Guardar</button>
        <button className="btn" onClick={onMove} style={{flex:1,background:colors.btnSecondary,color:colors.warning,padding:"6px 0",fontSize:12}}>Mover</button>
        <button className="btn" onClick={onDelete} style={{flex:1,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"6px 0",fontSize:12}}>Eliminar</button>
      </div>
    </div>);
  }

  // ── Root: gate de sesión + captura de invitación por link ──────────────────────
  function Root() {
    const [session,setSession]=useState(undefined); // undefined=cargando, null=sin sesión
    const [inviteInfo,setInviteInfo]=useState(null);
    const [inviteChecked,setInviteChecked]=useState(false);
    const [pendingInvite,setPendingInvite]=useState(null);
    const isDarkModeAuth=(()=>{try{return localStorage.getItem("canasta_dark_mode")!=="false";}catch{return true;}})();
    const colorsAuth=getColors(isDarkModeAuth);

    useEffect(()=>{
      const m=(window.location.hash||"").match(/^#join\/([a-zA-Z0-9]+)/);
      if(m){
        setPendingInvite(m[1]);
        sb.rpc("buscar_grupo_por_codigo",{codigo:m[1]})
          .then(({data})=>{setInviteInfo(data&&data[0]?data[0]:null);setInviteChecked(true);})
          .catch(()=>setInviteChecked(true));
      } else setInviteChecked(true);
    },[]);

    useEffect(()=>{
      sb.auth.getSession().then(({data})=>setSession(data.session||null));
      const {data:listener}=sb.auth.onAuthStateChange((_evt,s)=>setSession(s));
      return ()=>listener.subscription.unsubscribe();
    },[]);

    if(session===undefined||!inviteChecked){
      return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"#3b82f6",fontFamily:"monospace"}}>Cargando…</div>;
    }
    if(!session){
      return <AuthScreen colors={colorsAuth} inviteInfo={inviteInfo} onAuthed={()=>{}}/>;
    }
    return <App session={session} pendingInvite={pendingInvite} onInviteHandled={()=>setPendingInvite(null)}/>;
  }

  // ── Mount ────────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<Root/>);

})();
</script>
</body>
</html>
